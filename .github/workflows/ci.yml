name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go mod vet build test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install CGO and sandbox deps
        # bubblewrap is the Linux sandbox backend; without it the safety
        # manager fails closed at startup and the whole suite cannot run.
        run: sudo apt-get update && sudo apt-get install -y build-essential bubblewrap
      - run: go mod verify
      - run: scripts/check-release-versions.sh
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd pkg third_party)" || { gofmt -l cmd pkg third_party; exit 1; }
      - name: Verify package graph
        run: |
          scripts/package-graph.sh
          git diff --exit-code -- pkg/architecture/testdata/graph.json
      - name: Package manifest report
        run: |
          scripts/manifest-report.sh manifest-report.md
          cat manifest-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload package manifest report
        uses: actions/upload-artifact@v4
        with:
          name: manifest-report
          path: manifest-report.md
      - name: go build (CGO required)
        env:
          CGO_ENABLED: "1"
        run: go build -tags fts5 ./...
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test -tags fts5 ./... -count=1 -timeout 20m

  # The full Windows suite is not green yet (POSIX file-mode assertions and
  # similar platform gaps, never exercised before this repository had CI). It
  # stays visible here without blocking merges until it is Windows-ready;
  # the required "Windows build test (CGO)" job keeps proving the build.
  windows-tests:
    name: Windows test suite (non-blocking)
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test -tags fts5 ./... -count=1 -timeout 30m

  go-install:
    name: go install from a module proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install CGO deps
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: scripts/check-go-install.sh

  windows:
    name: Windows build test (CGO)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # windows-latest ships mingw-w64 gcc; CGO is mandatory so the weixin silk
      # voice decoder and other cgo features are compiled into the binary.
      - run: go mod verify
      - name: go build (CGO required)
        env:
          CGO_ENABLED: "1"
        run: go build -tags fts5 ./...
      - name: Verify silk decoder is compiled in (cgo build tag)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go list -tags fts5 -f '{{.GoFiles}}' ./pkg/channel | grep -q silk_cgo.go

  macos:
    name: macOS build (CGO)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: CGO_ENABLED=1 go build -tags fts5 ./...
      # Prove the Intel mac binary cross-compiles on an arm64 runner; the
      # release workflow builds darwin/amd64 the same way.
      - run: CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -tags fts5 -o /dev/null ./cmd/forebrain

  frontend:
    name: Frontend install build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Third-party actions are pinned to a full commit SHA; Dependabot
      # updates the pin together with the trailing version comment.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.24.0
      - name: pnpm install, test and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build

  webui-dist:
    name: Web UI build is release-managed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Third-party actions are pinned to a full commit SHA; Dependabot
      # updates the pin together with the trailing version comment.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.24.0
      # GITHUB_HEAD_REF tells the script whether this is a release-please
      # branch (rebuild-and-compare) or an ordinary PR (must not touch dist).
      - env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: scripts/check-webui-dist.sh "${{ github.event.pull_request.base.sha }}"
