name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go mod vet build test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install CGO and sandbox deps
        # bubblewrap is the Linux sandbox backend; without it the safety
        # manager fails closed at startup and the whole suite cannot run.
        # Ubuntu 24.04 confines unprivileged user namespaces behind AppArmor,
        # which stops bwrap from setting up its uid map, so the restriction is
        # lifted for this runner. ripgrep is what the shell tool's read-only
        # code search invokes.
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential bubblewrap ripgrep pkg-config
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
      - run: go mod verify
      - run: scripts/check-release-versions.sh
      # Forebrain links a native tokenizers static library; fetch the one for
      # this runner before anything compiles.
      - run: scripts/fetch-libtokenizers.sh
      # pkg/tool imports pkg/pdf, which links PDFium through
      # `// #cgo pkg-config: pdfium`, so vet/build/test all need the fetched
      # library on PKG_CONFIG_PATH (installed with build-essential above). The
      # CJK fallback fonts are what make pkg/pdf's non-tofu test meaningful on a
      # runner with no CJK system font.
      - name: Fetch PDFium and the CJK fonts
        run: |
          scripts/fetch-pdfium.sh
          scripts/fetch-pdfium-fonts.sh
          echo "PKG_CONFIG_PATH=$PWD/third_party/pdfium/$(go env GOOS)_$(go env GOARCH)" >> "$GITHUB_ENV"
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd pkg third_party)" || { gofmt -l cmd pkg third_party; exit 1; }
      - name: Verify package graph
        run: |
          scripts/package-graph.sh
          git diff --exit-code -- pkg/architecture/testdata/graph.json
      - name: Package manifest report
        run: |
          scripts/manifest-report.sh manifest-report.md
          cat manifest-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload package manifest report
        uses: actions/upload-artifact@v4
        with:
          name: manifest-report
          path: manifest-report.md
      - name: go build (CGO required)
        env:
          CGO_ENABLED: "1"
        run: go build -tags fts5 ./...
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test -tags fts5 ./... -count=1 -timeout 20m

  # The full Windows suite is not green yet (POSIX file-mode assertions and
  # similar platform gaps, never exercised before this repository had CI). It
  # stays visible here without blocking merges until it is Windows-ready;
  # the required "Windows build test (CGO)" job keeps proving the build.
  windows-tests:
    name: Windows test suite (non-blocking)
    runs-on: windows-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Cache the tokenizers static library
        uses: actions/cache@v4
        with:
          path: third_party/libtokenizers/windows_amd64
          key: libtokenizers-windows-amd64-${{ hashFiles('go.mod') }}
      - name: Add the Windows GNU Rust target
        shell: bash
        run: rustup target add x86_64-pc-windows-gnu
      - name: Fetch the tokenizers static library
        shell: bash
        run: scripts/fetch-libtokenizers.sh windows/amd64
      # pkg/pdf links PDFium through `// #cgo pkg-config: pdfium`; the runner
      # image ships no pkg-config, so install one, fetch the Windows library,
      # and point pkg-config at it for the rest of the job.
      - name: Install pkg-config
        run: if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) { choco install pkgconfiglite -y --no-progress }
      - name: Fetch PDFium and the CJK fonts
        shell: bash
        run: |
          scripts/fetch-pdfium.sh windows/amd64
          scripts/fetch-pdfium-fonts.sh
          dir="$PWD/third_party/pdfium/windows_amd64"
          if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -w "$dir")"; fi
          echo "PKG_CONFIG_PATH=$dir" >> "$GITHUB_ENV"
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test -tags fts5 ./... -count=1 -timeout 30m

  windows:
    name: Windows build test (CGO)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # windows-latest ships mingw-w64 gcc; CGO is mandatory so the weixin silk
      # voice decoder and other cgo features are compiled into the binary.
      - run: go mod verify
      - name: Cache the tokenizers static library
        uses: actions/cache@v4
        with:
          path: third_party/libtokenizers/windows_amd64
          key: libtokenizers-windows-amd64-${{ hashFiles('go.mod') }}
      - name: Add the Windows GNU Rust target
        shell: bash
        run: rustup target add x86_64-pc-windows-gnu
      - name: Fetch the tokenizers static library
        shell: bash
        run: scripts/fetch-libtokenizers.sh windows/amd64
      # pkg/pdf links PDFium through `// #cgo pkg-config: pdfium`; the runner
      # image ships no pkg-config, so install one, fetch the Windows library,
      # and point pkg-config at it. See the windows-tests job for the same steps.
      - name: Install pkg-config
        run: if (-not (Get-Command pkg-config -ErrorAction SilentlyContinue)) { choco install pkgconfiglite -y --no-progress }
      - name: Fetch PDFium
        shell: bash
        run: |
          scripts/fetch-pdfium.sh windows/amd64
          dir="$PWD/third_party/pdfium/windows_amd64"
          if command -v cygpath >/dev/null 2>&1; then dir="$(cygpath -w "$dir")"; fi
          echo "PKG_CONFIG_PATH=$dir" >> "$GITHUB_ENV"
      - name: go build (CGO required)
        env:
          CGO_ENABLED: "1"
        run: go build -tags fts5 ./...
      - name: Verify silk decoder is compiled in (cgo build tag)
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go list -tags fts5 -f '{{.GoFiles}}' ./pkg/channel | grep -q silk_cgo.go

  macos:
    name: macOS build (CGO)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The mac runner builds both darwin targets, so fetch both archives.
      - run: scripts/fetch-libtokenizers.sh darwin/arm64 darwin/amd64
      # pkg/pdf links PDFium through `// #cgo pkg-config: pdfium`; fetch both
      # triples (the Intel build below links the amd64 library) and make sure
      # pkg-config itself is present.
      - run: command -v pkg-config >/dev/null 2>&1 || brew install pkg-config
      - run: scripts/fetch-pdfium.sh darwin/arm64 darwin/amd64
      - run: CGO_ENABLED=1 PKG_CONFIG_PATH="$PWD/third_party/pdfium/darwin_arm64" go build -tags fts5 ./...
      # Prove the Intel mac binary cross-compiles on an arm64 runner; the
      # release workflow builds darwin/amd64 the same way.
      - run: CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" PKG_CONFIG_PATH="$PWD/third_party/pdfium/darwin_amd64" go build -tags fts5 -o /dev/null ./cmd/forebrain

  frontend:
    name: Frontend install build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Third-party actions are pinned to a full commit SHA; Dependabot
      # updates the pin together with the trailing version comment.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.24.0
      - name: pnpm install, test and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build

  webui-dist:
    name: Web UI build is release-managed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Third-party actions are pinned to a full commit SHA; Dependabot
      # updates the pin together with the trailing version comment.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.24.0
      # GITHUB_HEAD_REF tells the script whether this is a release-please
      # branch (rebuild-and-compare) or an ordinary PR (must not touch dist).
      - env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: scripts/check-webui-dist.sh "${{ github.event.pull_request.base.sha }}"
