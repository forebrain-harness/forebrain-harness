name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # govulncheck loads every package, including pkg/pdf, whose cgo needs the
      # PDFium library the go-pdfium binding reaches through pkg-config.
      - name: Install pkg-config and fetch PDFium
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config
          scripts/fetch-pdfium.sh
          echo "PKG_CONFIG_PATH=$PWD/third_party/pdfium/$(go env GOOS)_$(go env GOARCH)" >> "$GITHUB_ENV"
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
