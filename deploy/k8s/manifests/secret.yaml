# The home's first-boot configuration (plan 214 §3.4): forebrain.yaml plus
# the .env its ${...} references resolve from. The deployment's init
# container copies both into the shared volume ONLY when they are not there
# yet; after that the web's configuration editor owns forebrain.yaml.
#
# Replace every placeholder before `kubectl apply`:
#   FOREBRAIN_GATEWAY_TOKEN   shared secret every request carries (web
#                             sign-in and peer replicas alike)
#   FOREBRAIN_LLM_API_KEY     the LLM provider key
#   provider/model/base_url   your LLM: an internet provider or an internal
#                             OpenAI-compatible endpoint
#   database.url              the external MySQL/PostgreSQL the replicas
#                             share — multi-replica does not exist on
#                             SQLite. CREATE DATABASE statements are in
#                             docs/deploy/kubernetes.md.
#
# Editing the Secret later does not re-seed: an existing forebrain.yaml in
# the volume wins. To start over, see docs/deploy/kubernetes.md (升级与备份).
apiVersion: v1
kind: Secret
metadata:
  name: forebrain-config
  namespace: forebrain
  labels:
    app.kubernetes.io/name: forebrain
type: Opaque
stringData:
  forebrain.yaml: |
    gateway:
      http_addr: "0.0.0.0:6060"
      auth:
        mode: token
        token: "${FOREBRAIN_GATEWAY_TOKEN}"
    database:
      # placeholder — your MySQL/PostgreSQL; see docs/deploy/kubernetes.md
      url: "mysql://forebrain:CHANGE_ME@mysql.internal:3306/forebrain"
    agents:
      definitions:
        main:
          primary: true
          llm_providers:
            # placeholder — your provider, model and endpoint
            - provider: deepseek
              model: CHANGE_ME
              api_key: "${FOREBRAIN_LLM_API_KEY}"
              base_url: https://api.deepseek.com
  env: |
    FOREBRAIN_GATEWAY_TOKEN=CHANGE_ME
    FOREBRAIN_LLM_API_KEY=CHANGE_ME
