# The home's first-boot configuration (plan 214 §3.4, plan 268): forebrain.yaml
# plus the environment its ${...} references resolve from. There is no .env:
# the gateway token reaches the process through the environment (this Secret)
# or sits in gateway.auth.token. The deployment's init container writes
# forebrain.yaml into the shared volume ONLY when it is not there yet; after
# that the web's pages own the file.
#
# Models are not seeded: the gateway serves with none, and the first one is
# added after signing in, under Settings › Models (or by signing in to a
# subscription there).
#
# Replace every placeholder before `kubectl apply`:
#   gateway-token             shared secret every request carries (web
#                             sign-in and peer replicas alike)
#   database.url              the external MySQL/PostgreSQL the replicas
#                             share — multi-replica does not exist on
#                             SQLite. CREATE DATABASE statements are in
#                             docs/deploy/kubernetes.md.
#
# Editing the Secret later does not re-seed: an existing forebrain.yaml in
# the volume wins. To start over, see docs/deploy/kubernetes.md (升级与备份).
apiVersion: v1
kind: Secret
metadata:
  name: forebrain-config
  namespace: forebrain
  labels:
    app.kubernetes.io/name: forebrain
type: Opaque
stringData:
  forebrain.yaml: |
    gateway:
      http_addr: "0.0.0.0:6060"
      auth:
        token: "${FOREBRAIN_GATEWAY_TOKEN}"
    database:
      # placeholder — your MySQL/PostgreSQL; see docs/deploy/kubernetes.md
      url: "mysql://forebrain:CHANGE_ME@mysql.internal:3306/forebrain"
  # The value the pods read from the environment (plan 268): the token is what
  # the seeded ${FOREBRAIN_GATEWAY_TOKEN} resolves to. Nothing is written into a
  # .env any more.
  gateway-token: CHANGE_ME
