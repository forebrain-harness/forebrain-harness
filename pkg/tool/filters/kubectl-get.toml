[filters.kubectl-get]
description = "Compact kubectl get/describe tables and YAML; cap long listings with head+tail."
version = "2"
match_command = '^kubectl\s+(get|describe|api-resources|api-versions)\b'
match_output_select = [
  '(?m)^NAME\s+READY\s+STATUS',
  '(?m)^NAMESPACE\s+NAME\s+',
  '(?m)^NAME\s+NAMESPACE\s+',
  '(?m)^Name:\s+',
  '(?m)^Kind:\s+',
  '(?m)Unable to connect to the server',
  '(?m)Error from server',
]
strip_ansi = true
strip_lines_matching = [
  '^\s*$',
  '^\s+resourceVersion:\s',
  '^\s+uid:\s',
  '^\s+generation:\s',
  '^\s+creationTimestamp:\s',
]
max_lines = 60
max_lines_keep_tail = 20

[[tests.kubectl-get]]
name = "pod table: blanks stripped, rows kept"
input = """
NAME                     READY   STATUS    RESTARTS   AGE
api-7d4f8b9c6d-abcde     1/1     Running   0          2d
worker-5c9d7f8b6-xyz12   0/1     CrashLoopBackOff   5   10m
"""
expected = """NAME                     READY   STATUS    RESTARTS   AGE
api-7d4f8b9c6d-abcde     1/1     Running   0          2d
worker-5c9d7f8b6-xyz12   0/1     CrashLoopBackOff   5   10m"""

[[tests.kubectl-get]]
name = "describe: strips metadata noise, keeps identity and status"
input = """
Name:         api-7d4f8b9c6d-abcde
Namespace:    production
Labels:       app=api
Annotations:  kubectl.kubernetes.io/restartedAt: 2026-07-14T09:00:00Z
Status:       Running
IP:           10.0.1.42
  resourceVersion: "1234567"
  uid: 8f3c2a1b-0000-0000-0000-abcdef123456
  generation: 3
  creationTimestamp: "2026-07-01T10:00:00Z"
Containers:
  api:
    State:          Running
"""
expected = """Name:         api-7d4f8b9c6d-abcde
Namespace:    production
Labels:       app=api
Annotations:  kubectl.kubernetes.io/restartedAt: 2026-07-14T09:00:00Z
Status:       Running
IP:           10.0.1.42
Containers:
  api:
    State:          Running"""

[[tests.kubectl-get]]
name = "server error preserved verbatim"
input = "Error from server (Forbidden): pods is forbidden: User cannot list resource"
expected = "Error from server (Forbidden): pods is forbidden: User cannot list resource"

