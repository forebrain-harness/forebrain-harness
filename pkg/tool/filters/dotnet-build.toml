[filters.dotnet-build]
description = "Drop C# build banners and restore boilerplate; keep projects, diagnostics, counts, and final results."
version = "2"
match_command = '^(dotnet\s+(build|msbuild)\b|[Mm][Ss][Bb]uild(\.exe)?\b)'
match_output_select = [
  '(?m)^Microsoft \(R\) Build Engine version ',
  '(?m)^MSBuild version \S+ for \.NET',
]
strip_ansi = true
strip_lines_matching = [
  '^\s*$',
  '^Microsoft \(R\) Build Engine version ',
  '^MSBuild version \S+ for \.NET',
  '^Copyright \([Cc]\) Microsoft Corporation\.',
  '^\s*Determining projects to restore',
  '^\s*All projects are up-to-date for restore\.$',
  '^\s*Restored .+ \(in [\d.]+ (ms|sec)\)\.$',
]

[[tests.dotnet-build]]
name = "successful build keeps project result counts and elapsed time"
input = """
Microsoft (R) Build Engine version 17.8.3+195e7f5a3
Copyright (C) Microsoft Corporation. All rights reserved.

  Determining projects to restore...
  All projects are up-to-date for restore.
  MyApp -> /home/user/MyApp/bin/Debug/net8.0/MyApp.dll

Build succeeded.
    0 Warning(s)
    0 Error(s)

Time Elapsed 00:00:02.34
"""
expected = """  MyApp -> /home/user/MyApp/bin/Debug/net8.0/MyApp.dll
Build succeeded.
    0 Warning(s)
    0 Error(s)
Time Elapsed 00:00:02.34"""

[[tests.dotnet-build]]
name = "build with warnings not short-circuited"
input = """
Microsoft (R) Build Engine version 17.8.3+195e7f5a3
Copyright (C) Microsoft Corporation. All rights reserved.

  Determining projects to restore...
  MyApp -> /home/user/MyApp/bin/Debug/net8.0/MyApp.dll

Build succeeded.
    3 Warning(s)
    0 Error(s)

Time Elapsed 00:00:01.87
"""
expected = "  MyApp -> /home/user/MyApp/bin/Debug/net8.0/MyApp.dll\nBuild succeeded.\n    3 Warning(s)\n    0 Error(s)\nTime Elapsed 00:00:01.87"

[[tests.dotnet-build]]
name = "build errors pass through"
