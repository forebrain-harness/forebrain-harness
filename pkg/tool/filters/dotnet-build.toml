Build succeeded.
    0 Warning(s)
    0 Error(s)

Time Elapsed 00:00:03.14"""
expected = """  Core -> /repo/Core/bin/Debug/net8.0/Core.dll
  App -> /repo/App/bin/Debug/net8.0/App.dll
Build succeeded.
    0 Warning(s)
    0 Error(s)
Time Elapsed 00:00:03.14"""

