[filters.hadolint]
description = "Compact hadolint Dockerfile linting output"
match_command = "^hadolint\\b"
match_output_select = [
  '(?m)\bDL\d{4}\b',
]
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
max_lines = 40

[[tests.hadolint]]
name = "Dockerfile warnings kept, blank lines stripped"
input = """
Dockerfile:3 DL3008 warning: Pin versions in apt-get install
Dockerfile:5 DL3009 info: Delete apt-get lists after installing

Dockerfile:8 DL4006 warning: Set SHELL option -o pipefail before RUN with pipe
"""
expected = "Dockerfile:3 DL3008 warning: Pin versions in apt-get install\nDockerfile:5 DL3009 info: Delete apt-get lists after installing\nDockerfile:8 DL4006 warning: Set SHELL option -o pipefail before RUN with pipe"

[[tests.hadolint]]
name = "empty input passes through"
input = ""
expected = ""

[[tests.hadolint]]
name = "5 real Dockerfile lint violations, blank lines stripped"
input = """
Dockerfile:3 DL3006 warning: Always tag the version of an image explicitly
Dockerfile:7 DL3008 warning: Pin versions in apt get install.
Dockerfile:7 DL3009 info: Delete the apt-get lists after installing something.
Dockerfile:12 DL4006 warning: Set the SHELL option -o pipefail before RUN with a pipe in it.
Dockerfile:18 DL3020 error: Use COPY instead of ADD for files and folders.
"""
expected = """
Dockerfile:3 DL3006 warning: Always tag the version of an image explicitly
Dockerfile:7 DL3008 warning: Pin versions in apt get install.
Dockerfile:7 DL3009 info: Delete the apt-get lists after installing something.
Dockerfile:12 DL4006 warning: Set the SHELL option -o pipefail before RUN with a pipe in it.
Dockerfile:18 DL3020 error: Use COPY instead of ADD for files and folders.
"""
