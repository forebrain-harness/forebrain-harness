[filters.dotnet-test]
description = "Drop C# test banners/restore noise; keep every test outcome, failure detail, attachment, and summary."
version = "2"
match_command = '^(dotnet\s+(test|vstest)\b|vstest\.console(\.exe)?\b)'
match_output_select = [
  'Starting test execution',
  'Passed!\s+-\s+Failed:',
  'Failed!\s+-\s+Failed:',
  '^\s*Failed \S',
]
strip_ansi = true
strip_lines_matching = [
  '^\s*$',
  '^Microsoft \(R\)',
  '^Copyright \(',
  '^\s*Determining projects',
  '^\s*Restored ',
  '^Starting test execution',
  '^A total of \d+ test files',
]

[[tests.dotnet-test]]
name = "keeps failure and assert detail, drops banners"
input = """  Determining projects to restore...
  Restored /repo/App.csproj (in 1.2 sec).
Microsoft (R) Test Execution Command Line Tool Version 17.8.0
Copyright (c) Microsoft Corporation. All rights reserved.

Starting test execution, please wait...
A total of 1 test files matched the specified pattern.
  Failed AppTests.MathTests.Add [12 ms]
  Error Message:
   Assert.Equal() Failure
   Expected: 3
   Actual:   2

Failed!  - Failed:     1, Passed:    9, Skipped:     0, Total:    10, Duration: 1 s"""
expected = """Failed AppTests.MathTests.Add [12 ms]
  Error Message:
   Assert.Equal() Failure
   Expected: 3
   Actual:   2
Failed!  - Failed:     1, Passed:    9, Skipped:     0, Total:    10, Duration: 1 s"""

