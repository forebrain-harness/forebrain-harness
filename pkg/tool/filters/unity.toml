[filters.unity]
description = "Drop Unity Editor batch-mode startup and import profiling noise; keep diagnostics, tests, and results."
version = "3"
match_command = '^([Uu]nity(\.exe)?|unity-editor)\b'
match_output_select = [
  '(?m)^BatchMode: 1, IsHumanControllingUs: 0,',
  "(?m)^Built from '.+' branch; Version is '.+'; Using compiler version ",
  '(?m)^Initialize engine version: \d',
  '(?m)^Exiting batchmode (successfully|due to failure)',
]
strip_ansi = true
strip_lines_matching = [
  '^\s*$',
  '^Using pre-set license$',
  '^\[UnityMemory\] Configuration Parameters',
  '^\s+"memorysetup-[^"]+"$',
  '^=+$',
  '^Received Import Request\.$',
  '^  Time since last request: [\d.]+ seconds\.$',
  '^Number of updated asset objects reloaded before import = \d+Number of asset objects unloaded after import = \d+$',
  '^Refreshing native plugins compatible for Editor in [\d.]+ ms, found \d+ plugins\.$',
  '^Preloading \d+ native plugins for Editor in [\d.]+ ms\.$',
  '^Player connection \[\d+\]\s+Target information:$',
  '^Player connection \[\d+\]\s+\* ".+"\s*$',
  '^Player connection \[\d+\] Host joined (alternative )?multi-casting on \[.+\]\.\.\.$',
  '^Unloading \d+ Unused Serialized files \(Serialized files now loaded: \d+\)$',
  '^Unloading \d+ unused Assets / \([\d.]+ [KMGT]?B\)\. Loaded Objects now: \d+\.$',
  '^Memory consumption went from [\d.]+ [KMGT]?B to [\d.]+ [KMGT]?B\.$',
  '^Total: [\d.]+ ms \(FindLiveObjects: [\d.]+ ms CreateObjectMapping: [\d.]+ ms MarkObjects: [\d.]+ ms\s+DeleteObjects: [\d.]+ ms\)$',
  '^- Loaded All Assemblies, in\s+[\d.]+ seconds$',
  '^- Finished resetting the current domain, in\s+[\d.]+ seconds$',
  '^\s+(BeginReloadAssembly|ExecutionOrderSort2?|DisableScriptedObjects|BackupInstance|ReleaseScriptingObjects|CreateAndSetChildDomain|RebuildCommonClasses|RebuildNativeTypeToScriptingClass|initialDomainReloadingComplete|LoadAllAssembliesAndSetupDomain|LoadAssemblies|RebuildTransferFunctionScriptingTraits|AnalyzeDomain|TypeCache\.Refresh|TypeCache\.ScanAssembly|BuildScriptInfoCaches|ResolveRequiredComponents|FinalizeReload|ReleaseScriptCaches|RebuildScriptCaches|SetupLoadedEditorAssemblies|LogAssemblyErrors|InitializePlatformSupportModulesInManaged|SetLoadedEditorAssemblies|BeforeProcessingInitializeOnLoad|ProcessInitializeOnLoadAttributes|ProcessInitializeOnLoadMethodAttributes|AfterProcessingInitializeOnLoad|EditorAssembliesLoaded|AwakeInstancesAfterBackupRestoration) \(\d+ms\)$',
]

