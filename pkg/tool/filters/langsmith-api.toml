[filters.langsmith-api]
description = "Truncate long LangSmith runs/query JSON lines; keep run content."
version = "2"
match_command = '(?m)(^|[;&|]\s*)(?:[A-Za-z0-9_]+=\S+\s+)*curl\s+.*langsmith'
match_output_select = [
  '(?m)"run_type"\s*:',
  '(?m)"dotted_order"\s*:',
  '(?m)"trace_id"\s*:',
  '(?m)"tenant_id"\s*:',
]
strip_ansi = true
strip_lines_matching = [
  '^\s*$',
]

