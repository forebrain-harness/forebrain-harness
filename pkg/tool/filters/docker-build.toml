[filters.docker-build]
description = "Drop BuildKit progress/timing/digests; keep Dockerfile steps, RUN output, cache, naming, and errors."
version = "2"
match_command = '^docker\s+(build|buildx)\b'
match_output_select = [
  '^#\d+ \[',
  'naming to ',
  'exporting to image',
  'ERROR: failed to solve',
]
strip_ansi = true
replace = [
  { pattern = '@sha256:[0-9a-f]+', replacement = '' },
]
strip_lines_matching = [
  '^\s*$',
  '\[internal\]',
  'transferring',
  '^#\d+ DONE ',
  'exporting layers',
  'writing image',
  'exporting manifest',
  '^#\d+ extracting ',
  '^#\d+ resolve ',
]

[[tests.docker-build]]
name = "keeps steps and naming, drops transfer/timing noise"
input = """#1 [internal] load build definition from Dockerfile
#1 transferring dockerfile: 215B done
#1 DONE 0.0s

#4 [1/3] FROM docker.io/library/node:20@sha256:abc123
#4 CACHED

#5 [2/3] COPY package.json ./
#5 DONE 0.2s

#6 [3/3] RUN npm ci
#6 12.345 added 200 packages in 12s
#6 DONE 13.5s

#7 exporting to image
#7 exporting layers
#7 writing image sha256:def456 done
#7 naming to docker.io/library/myapp:latest done
#7 DONE 0.3s"""
expected = """#4 [1/3] FROM docker.io/library/node:20
#4 CACHED
#5 [2/3] COPY package.json ./
#6 [3/3] RUN npm ci
#6 12.345 added 200 packages in 12s
#7 exporting to image
#7 naming to docker.io/library/myapp:latest done"""

[[tests.docker-build]]
name = "keeps build errors"
input = """#6 [3/3] RUN npm ci
#6 5.123 npm error code ELIFECYCLE
#6 ERROR: process "/bin/sh -c npm ci" did not complete successfully: exit code: 1
ERROR: failed to solve: process "/bin/sh -c npm ci" did not complete successfully: exit code: 1"""
expected = """#6 [3/3] RUN npm ci
#6 5.123 npm error code ELIFECYCLE
#6 ERROR: process "/bin/sh -c npm ci" did not complete successfully: exit code: 1
ERROR: failed to solve: process "/bin/sh -c npm ci" did not complete successfully: exit code: 1"""

# `docker ps` / `docker images` are columnar (one row per container/image), so
# there is no per-line waste to strip
