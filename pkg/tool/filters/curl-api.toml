        "type": "file",
        "size": 3965,
        "sha256": "59a7f1fdb1dc29e5c0e7e39d9d1f19dc9f69a76771fbcb31e925a64eac091357",
        "props": {
            "build.name": ["access-multi-arch-docker-dev"],
            "build.number": ["90"],
            "vcs.branch": ["master"],
            "vcs.org": ["JFROG"],
            "vcs.provider": ["github"],
            "vcs.repo": ["access"],
            "vcs.revision": ["abc123def456789012345678901234567890abcd"],
            "docker.manifest": ["jfrog/access/sha256:abc/sha256__def"],
            "docker.repoName": ["dev-master-docker-local"]
        }
    }
]"""

