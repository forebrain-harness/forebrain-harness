[filters.jf-rt-curl]
description = "Compact jf rt curl JSON; truncate long docker tag arrays."
version = "2"
match_command = "(^|[;&|]\\s*)jf\\s+rt\\s+curl\\b"
match_output_select = [
  '(?m)"tags"\s*:\s*\[',
  '(?m)"name"\s*:\s*"[^"]+"\s*,\s*"tags"',
]
strip_ansi = true
strip_lines_matching = [
  '^\s*$',
]
on_empty = "jf rt curl: ok"

