[filters.valgrind]
description = "Strip valgrind ==PID== prefix and banner noise; keep leak/error/summary blocks."
version = "1"
match_command = '(^|[;&| ])valgrind(\s|$)'
match_output_select = ['(?m)^==\d+== ']
strip_ansi = true
replace = [
  { pattern = '^==\d+==\s?', replacement = '' },
]
strip_lines_matching = [
  '^\s*$',
  '^Memcheck, a memory error detector',
  '^Copyright \(C\)',
  '^Using Valgrind-',
  '^Command: ',
  'rerun with: ',
]
max_lines = 60
on_empty = "valgrind: no errors"

[[tests.valgrind]]
name = "clean run keeps program output and summary blocks, drops banner"
input = """
==1058== Memcheck, a memory error detector
==1058== Copyright (C) 2002-2022, and GNU GPL'd, by Julian Seward et al.
==1058== Using Valgrind-3.22.0 and LibVEX; rerun with -h for copyright info
==1058== Command: /app/debug
==1058== 
=== Computation completed successfully ===
==1058== 
==1058== HEAP SUMMARY:
==1058==     in use at exit: 73,728 bytes in 1 blocks
==1058==   total heap usage: 14 allocs, 13 frees, 10,564,968 bytes allocated
==1058== 
==1058== LEAK SUMMARY:
==1058==    definitely lost: 0 bytes in 0 blocks
==1058==    still reachable: 73,728 bytes in 1 blocks
==1058== 
==1058== For lists of detected and suppressed errors, rerun with: -s
==1058== ERROR SUMMARY: 0 errors from 0 contexts (suppressed: 0 from 0)
"""
expected = """
=== Computation completed successfully ===
HEAP SUMMARY:
    in use at exit: 73,728 bytes in 1 blocks
  total heap usage: 14 allocs, 13 frees, 10,564,968 bytes allocated
LEAK SUMMARY:
   definitely lost: 0 bytes in 0 blocks
   still reachable: 73,728 bytes in 1 blocks
ERROR SUMMARY: 0 errors from 0 contexts (suppressed: 0 from 0)
"""

