[[tests.valgrind]]
name = "banner-only output collapses to on_empty"
input = """
==99== Memcheck, a memory error detector
==99== Copyright (C) 2002-2022, and GNU GPL'd, by Julian Seward et al.
==99== Using Valgrind-3.22.0 and LibVEX; rerun with -h for copyright info
==99== Command: ./x
==99== 
"""
expected = "valgrind: no errors"
