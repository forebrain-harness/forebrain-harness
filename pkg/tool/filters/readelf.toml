[filters.readelf]
description = "Bound large readelf dumps; preserve headers, tail, and every readelf warning/error."
version = "2"
match_command = '(^|[;&|/ ])([a-z0-9_-]*-)?readelf(\s|$)'
match_output_select = [
  "(?m)^Symbol table '",
  '(?m)^ELF Header:',
  '(?m)^Section Headers:',
  '(?m)^Program Headers:',
  '(?m)^Relocation section ',
  '(?m)^Dynamic section at offset ',
  '(?m)^Displaying notes found in:',
  '(?m)^Hex dump of section ',
  '(?m)^Version symbols section ',
  '(?m)^Version needs section ',
  '(?m)^Attribute Section:',
]
strip_ansi = true
max_lines = 120
max_lines_keep_tail = 40
max_lines_keep_matching = [
  '(?i)^([a-z0-9_-]*-)?readelf: (Error|Warning):',
]

[[tests.readelf]]
name = "short symbol table head passes through unchanged"
input = """
Symbol table '.symtab' contains 2029 entries:
   Num:    Value  Size Type    Bind   Vis      Ndx Name
     0: 00000000     0 NOTYPE  LOCAL  DEFAULT  UND 
     1: 004000d8     0 SECTION LOCAL  DEFAULT    1 .MIPS.abiflags
     2: 004000f0     0 SECTION LOCAL  DEFAULT    2 .reginfo
"""
expected = """
Symbol table '.symtab' contains 2029 entries:
   Num:    Value  Size Type    Bind   Vis      Ndx Name
     0: 00000000     0 NOTYPE  LOCAL  DEFAULT  UND 
     1: 004000d8     0 SECTION LOCAL  DEFAULT    1 .MIPS.abiflags
     2: 004000f0     0 SECTION LOCAL  DEFAULT    2 .reginfo
"""

[[tests.readelf]]
name = "error line is preserved"
input = "readelf: Error: '/app/missing': No such file"
expected = "readelf: Error: '/app/missing': No such file"

[[tests.readelf]]
name = "warning line is preserved"
input = "readelf: Warning: Section 5 has an out of range sh_link value of 99"
expected = "readelf: Warning: Section 5 has an out of range sh_link value of 99"

[[tests.readelf]]
name = "ELF header passes through unchanged"
input = """
ELF Header:
  Magic:   7f 45 4c 46 02 01 01 00
  Class:                             ELF64
  Data:                              2's complement, little endian
  Type:                              DYN (Shared object file)
  Machine:                           Advanced Micro Devices X86-64
  Entry point address:               0x1050"""
expected = """
ELF Header:
  Magic:   7f 45 4c 46 02 01 01 00
  Class:                             ELF64
  Data:                              2's complement, little endian
  Type:                              DYN (Shared object file)
  Machine:                           Advanced Micro Devices X86-64
  Entry point address:               0x1050"""

[[tests.readelf]]
name = "section headers and flags pass through unchanged"
input = """
Section Headers:
  [Nr] Name              Type             Address           Offset
  [ 0]                   NULL             0000000000000000  00000000
  [ 1] .interp           PROGBITS         0000000000000318  00000318
  [ 2] .note.gnu.bu[...] NOTE             0000000000000338  00000338
Key to Flags:
  W (write), A (alloc), X (execute), M (merge), S (strings), I (info)"""
expected = """
Section Headers:
  [Nr] Name              Type             Address           Offset
  [ 0]                   NULL             0000000000000000  00000000
  [ 1] .interp           PROGBITS         0000000000000318  00000318
  [ 2] .note.gnu.bu[...] NOTE             0000000000000338  00000338
Key to Flags:
  W (write), A (alloc), X (execute), M (merge), S (strings), I (info)"""

[[tests.readelf]]
name = "program headers and section mapping pass through unchanged"
input = """
Program Headers:
  Type           Offset             VirtAddr           PhysAddr
  PHDR           0x0000000000000040 0x0000000000000040 0x0000000000000040
  LOAD           0x0000000000000000 0x0000000000000000 0x0000000000000000
 Section to Segment mapping:
  Segment Sections...
   00
   01     .interp .note.gnu.build-id .text"""
expected = """
Program Headers:
  Type           Offset             VirtAddr           PhysAddr
  PHDR           0x0000000000000040 0x0000000000000040 0x0000000000000040
  LOAD           0x0000000000000000 0x0000000000000000 0x0000000000000000
 Section to Segment mapping:
  Segment Sections...
   00
   01     .interp .note.gnu.build-id .text"""

[[tests.readelf]]
name = "relocation symbols and addends pass through unchanged"
input = """
Relocation section '.rela.dyn' at offset 0x540 contains 2 entries:
  Offset          Info           Type           Sym. Value    Sym. Name + Addend
000000003fc0  000100000006 R_X86_64_GLOB_DAT 0000000000000000 __libc_start_main + 0
000000004008  000500000007 R_X86_64_JUMP_SLO 0000000000000000 puts + 0"""
expected = """
Relocation section '.rela.dyn' at offset 0x540 contains 2 entries:
  Offset          Info           Type           Sym. Value    Sym. Name + Addend
000000003fc0  000100000006 R_X86_64_GLOB_DAT 0000000000000000 __libc_start_main + 0
000000004008  000500000007 R_X86_64_JUMP_SLO 0000000000000000 puts + 0"""

[[tests.readelf]]
name = "dynamic section tags and values pass through unchanged"
input = """
Dynamic section at offset 0x2de0 contains 3 entries:
  Tag        Type                         Name/Value
 0x0000000000000001 (NEEDED)             Shared library: [libc.so.6]
 0x000000000000000c (INIT)               0x1000
 0x0000000000000005 (STRTAB)             0x470"""
expected = """
Dynamic section at offset 0x2de0 contains 3 entries:
  Tag        Type                         Name/Value
 0x0000000000000001 (NEEDED)             Shared library: [libc.so.6]
 0x000000000000000c (INIT)               0x1000
 0x0000000000000005 (STRTAB)             0x470"""

[[tests.readelf]]
name = "build ID and GNU notes pass through unchanged"
input = """
Displaying notes found in: .note.gnu.build-id
  Owner                Data size  Description
  GNU                  0x00000014 NT_GNU_BUILD_ID (unique build ID bitstring)
    Build ID: d8e8fca2dc0f896fd7cb4cb0031ba249"""
expected = """
Displaying notes found in: .note.gnu.build-id
  Owner                Data size  Description
  GNU                  0x00000014 NT_GNU_BUILD_ID (unique build ID bitstring)
    Build ID: d8e8fca2dc0f896fd7cb4cb0031ba249"""

[[tests.readelf]]
name = "hex dump offsets and bytes pass through unchanged"
input = """
Hex dump of section '.rodata':
  0x00002000 01000200 68656c6c 6f00776f 726c6400 ....hello.world."""
expected = """
Hex dump of section '.rodata':
  0x00002000 01000200 68656c6c 6f00776f 726c6400 ....hello.world."""

[[tests.readelf]]
name = "version requirements pass through unchanged"
input = """
Version needs section '.gnu.version_r' contains 1 entry:
 Addr: 0x0000000000000520  Offset: 0x000520  Link: 7 (.dynstr)
  000000: Version: 1  File: libc.so.6  Cnt: 2
  0x0010: Name: GLIBC_2.34  Flags: none  Version: 3"""
expected = """
Version needs section '.gnu.version_r' contains 1 entry:
 Addr: 0x0000000000000520  Offset: 0x000520  Link: 7 (.dynstr)
  000000: Version: 1  File: libc.so.6  Cnt: 2
  0x0010: Name: GLIBC_2.34  Flags: none  Version: 3"""
