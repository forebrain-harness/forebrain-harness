[filters.npm]
description = "Drop npm script header, warn/notice spam; keep output, results, and errors."
version = "1"
match_command = '^npm\b'
match_output_select = [
  '(?i)^npm (warn|notice|err)',
  '^> \S+@\S+',
  '^added \d+ packages',
  '(?i)^npm error',
]
strip_ansi = true
strip_lines_matching = [
  '^\s*$',
  '^> \S+@\S+',
  '(?i)^npm warn',
  '(?i)^npm notice',
]

[[tests.npm]]
name = "install drops deprecation warnings, keeps result"
input = """npm warn deprecated inflight@1.0.6: This module is not supported
npm warn deprecated glob@7.2.3: Glob versions prior to v9 are no longer supported

added 210 packages, and audited 211 packages in 5s

12 packages are looking for funding"""
expected = """added 210 packages, and audited 211 packages in 5s
12 packages are looking for funding"""

[[tests.npm]]
name = "run script drops the pkg header, keeps errors"
input = """> myapp@1.0.0 build
> tsc

src/index.ts(3,1): error TS1005: ';' expected.
npm error code 2"""
expected = """> tsc
src/index.ts(3,1): error TS1005: ';' expected.
npm error code 2"""
