[filters.xxd]
description = "Truncate xxd hex dumps to a useful head."
version = "1"
match_command = '(^|[;&|/ ])xxd(\s|$)'
match_output_select = [
  '(?m)^[0-9a-f]{8}: ',
]
strip_ansi = true
max_lines = 40

[[tests.xxd]]
name = "short hex dump passes through unchanged"
input = """
00000000: 5351 4c69 7465 2066 6f72 6d61 7420 3300  SQLite format 3.
00000010: 1000 0202 0040 2020 0000 0003 0000 0002  .....@  ........
00000020: 0000 0000 0000 0000 0000 0003 0000 0004  ................
"""
expected = """
00000000: 5351 4c69 7465 2066 6f72 6d61 7420 3300  SQLite format 3.
00000010: 1000 0202 0040 2020 0000 0003 0000 0002  .....@  ........
00000020: 0000 0000 0000 0000 0000 0003 0000 0004  ................
"""

[[tests.xxd]]
name = "error line is preserved"
input = "xxd: /app/main.db-wal: No such file or directory"
expected = "xxd: /app/main.db-wal: No such file or directory"
