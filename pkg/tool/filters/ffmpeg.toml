[libx264 @ 0xbe1425180] profile High, level 5.0
[libx264 @ 0xbe1425180] 264 - core 165 r3222 - H.264/MPEG-4 AVC codec
Output #0, mp4, to 'output.mp4':
  Stream #0:0: Video: h264, yuv420p, 1920x1160, 25 fps
frame=   60 fps=0.0 q=31.0 size=       0KiB time=00:00:02.32 bitrate=   0.2kbits/s speed=4.62x    frame=  116 fps=115 q=31.0 size=     256KiB time=00:00:04.56 bitrate= 460.0kbits/s speed=4.54x    frame=99194 fps=374 q=-1.0 Lsize=  151030KiB time=01:06:07.68 bitrate= 311.8kbits/s speed=14.9x
[mp4 @ 0xbe1013700] Starting second pass: moving the moov atom to the beginning of the file
[out#0/mp4 @ 0xbe1428300] video:116298KiB audio:32264KiB subtitle:0KiB muxing overhead: 1.661426%
