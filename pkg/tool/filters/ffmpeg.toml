  built with Apple clang version 21.0.0 (clang-2100.0.123.102)
  configuration: --prefix=/opt/homebrew/Cellar/ffmpeg/8.1.2 --enable-shared --enable-pthreads
  libavutil      60. 26.102 / 60. 26.102
  libavcodec     62. 28.102 / 62. 28.102
  libavformat    62. 12.102 / 62. 12.102
Input #0, mov,mp4,m4a,3gp,3g2,mj2, from 'input.mp4':
  Duration: 00:01:06.07, start: 0.000000, bitrate: 422 kb/s
  Stream #0:0: Video: h264, yuv420p, 1920x1160, 343 kb/s, 25 fps
  Stream #0:1: Audio: aac, 16000 Hz, mono, 73 kb/s
