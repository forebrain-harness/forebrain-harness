[filters.ffmpeg]
description = "Collapse ffmpeg encoding output: strip build config, per-frame progress spam, and codec stats; keep input/output stream info and final encoding result."
version = "1"
match_command = '^ffmpeg\b'
match_output_select = [
  '(?m)^ffmpeg version \d',
]
strip_ansi = true
strip_lines_matching = [
  # Build header noise
  '^  built with ',
  '^  configuration:',
  '^  lib\w',
  # 4+ space indent: nested stream Metadata, Side data, CPB properties
  '^    ',
  # Input/Output Metadata: label line (content is at 4-space indent, already stripped)
  '^  Metadata:',
  # Stream mapping block (keep stream info lines; strip only the -> mapping lines)
  '^Stream mapping:',
  '^  Stream #\d.*->',
  # Runtime markers
  '^Press \[q\]',
  # All codec/muxer logger lines
  '^\[libx264 @',
  '^\[aac @',
  '^\[mp4 @',
  '^\[out#',
]
replace = [
  # The entire progress blob is one giant line (frame= updates overwrite via \r when captured).
  # When encoding completes, the line contains Lsize=. Extract the final summary.
  { pattern = '^frame=.*Lsize=\s*(\S+)\s+time=(\S+)\s+bitrate=\s*(\S+)\s+speed=\s*(\S+).*$', replacement = 'Encoded: Lsize=$1 time=$2 bitrate=$3 speed=$4' },
  # ponytail: if encoding was interrupted (no Lsize= line), collapse the in-progress blob
  { pattern = '^frame=\s*\d+\s+fps=\S+\s+q=\S+\s+size=\s*(\S+)\s+time=(\S+).*$', replacement = '[encoding in progress: size=$1 time=$2]' },
]
max_lines = 20

[[tests.ffmpeg]]
name = "strips build config and progress blob, keeps stream info and final result"
input = """
