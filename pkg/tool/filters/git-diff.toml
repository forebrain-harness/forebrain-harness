[filters.git-diff]
description = "Compact git unified diff: drop index/no-newline noise, cap long diffs with head+tail."
version = "5"
match_command = "(^|[;&|]\\s*)(?:sudo\\s+)?git(?:\\s+(?:-[A-Za-z]\\S*|--\\S+))*\\s+diff\\b"
match_output_select = [
  "(?m)^diff --git ",
  "(?m)^diff --cc ",
]
strip_ansi = true
strip_lines_matching = [
  "^index [0-9a-f]+\\..*[0-9a-f]+ [0-9]+",
  "^similarity index \\d+%",
  "\\\\ No newline at end of file",
  "^\\s*$",
]
# Groundcover retrieve rollbacks often cite "need full git diff"; keep more hunks
# while still capping megabyte patches (head + tail preserves recent changes).
max_lines = 400
max_lines_keep_tail = 120

[[tests.git-diff]]
name = "strips index lines, keeps change hunks"
input = """diff --git a/app/client.go b/app/client.go
index 1234567..89abcde 100644
--- a/app/client.go
+++ b/app/client.go
@@ -10,7 +10,7 @@ func Dial(addr string) error {
 	conn, err := net.Dial("tcp", addr)
 	if err != nil {
-		return err
+		return fmt.Errorf("dial %s: %w", addr, err)
 	}
 	return nil
 }
\\ No newline at end of file
"""
expected = """diff --git a/app/client.go b/app/client.go
--- a/app/client.go
+++ b/app/client.go
@@ -10,7 +10,7 @@ func Dial(addr string) error {
 	conn, err := net.Dial("tcp", addr)
 	if err != nil {
-		return err
+		return fmt.Errorf("dial %s: %w", addr, err)
 	}
 	return nil
 }"""

[[tests.git-diff]]
name = "preserves multi-file diff headers and additions"
input = """diff --git a/src/a.ts b/src/a.ts
index aaa1111..bbb2222 100644
--- a/src/a.ts
+++ b/src/a.ts
@@ -1,3 +1,4 @@
 export const a = 1;
+export const b = 2;
diff --git a/src/c.ts b/src/c.ts
index ccc3333..ddd4444 100644
--- a/src/c.ts
+++ b/src/c.ts
@@ -5,1 +5,1 @@
-old
+new
"""
expected = """diff --git a/src/a.ts b/src/a.ts
--- a/src/a.ts
+++ b/src/a.ts
@@ -1,3 +1,4 @@
 export const a = 1;
+export const b = 2;
diff --git a/src/c.ts b/src/c.ts
--- a/src/c.ts
+++ b/src/c.ts
@@ -5,1 +5,1 @@
-old
+new"""

