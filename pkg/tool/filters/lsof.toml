[filters.lsof]
description = "Cap lsof connection tables; keep header, listeners, and errors."
version = "2"
match_command = '^lsof\b'
match_output_select = [
  '(?m)^COMMAND\s+PID\s+USER\s+FD\s+TYPE',
]
strip_ansi = true
strip_lines_matching = [
  '^\s*$',
]
max_lines = 30
max_lines_keep_tail = 8
on_empty = "lsof: ok"

[[tests.lsof]]
name = "short port check passes through"
input = """COMMAND     PID    USER   FD   TYPE             DEVICE SIZE/OFF NODE NAME
node      22453 shaharm   18u  IPv6 0x58d75045f1ff21d7      0t0  TCP localhost:5173 (LISTEN)
backend:000
backend:down
frontend:200"""
expected = """COMMAND     PID    USER   FD   TYPE             DEVICE SIZE/OFF NODE NAME
node      22453 shaharm   18u  IPv6 0x58d75045f1ff21d7      0t0  TCP localhost:5173 (LISTEN)
backend:000
backend:down
frontend:200"""

