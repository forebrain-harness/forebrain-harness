[filters.gh-api]
description = "Compact gh api/pr JSON: strip URL/node_id noise and bot review-comment badge footers; keep errors."
version = "7"
match_command = "(^|[;&|]\\s*)gh\\s+(api|pr\\s+view|repo\\s+view|search)\\b"
match_output_select = [
  '(?m)"total_count"\s*:\s*\d',
  '(?m)"documentation_url"\s*:\s*"https://docs\.github\.com',
  '(?m)"comments"\s*:\s*\[\s*\{',
  '(?m)"commits"\s*:\s*\[\s*\{',
  '(?m)"items"\s*:\s*\[\s*\{',
  '(?m)"login"\s*:\s*"[^"]+"\s*,\s*"id"\s*:\s*\d',
  '(?m)"slug"\s*:\s*"[^"]+"\s*,\s*"description"',
  '(?m)"privacy"\s*:\s*"(secret|closed|public)"',
  '(?m)"diff_hunk"\s*:\s*"',
  '(?m)"in_reply_to_id"\s*:',
  '(?m)gh: .+\(HTTP \d+\)',
  '<div><a href=\\\\?"https://cursor\.com/open',
]
strip_ansi = true
replace = [
  { pattern = '"node_id"\s*:\s*"[^"]*"\s*,?\s*', replacement = "" },
  { pattern = '"id"\s*:\s*"MDQ[^"]*"\s*,?\s*', replacement = "" },
  { pattern = '"gravatar_id"\s*:\s*"[^"]*"\s*,?\s*', replacement = "" },
  { pattern = '"avatar_url"\s*:\s*"[^"]*"\s*,?\s*', replacement = "" },
  { pattern = '"(html_url|git_url|clone_url|ssh_url|svn_url|archive_url|labels_url|events_url|hooks_url|issue_events_url|keys_url|collaborators_url|teams_url|milestones_url|notifications_url|merges_url|downloads_url|compare_url|pulls_url|issues_url|statuses_url|languages_url|stargazers_url|contributors_url|subscribers_url|subscription_url|commits_url|git_commits_url|comments_url|issue_comment_url|contents_url|forks_url|releases_url|deployments_url|git_refs_url|git_tags_url|trees_url|blob_url|tags_url|assignees_url|branches_url|review_comments_url|review_comment_url|pull_request_url|repository_url|repos_url|members_url|url)"\s*:\s*"[^"]*"\s*,?\s*', replacement = "" },
  { pattern = '<div><a href=\\\\?"https://cursor\.com/open.*?</div>', replacement = "" },
]

[[tests.gh-api]]
name = "preserves small API error JSON and gh stderr on same line"
input = """{"message":"Not Found","documentation_url":"https://docs.github.com/rest/repos/repos#get-a-repository","status":"404"}gh: Not Found (HTTP 404)
"""
expected = """{"message":"Not Found","documentation_url":"https://docs.github.com/rest/repos/repos#get-a-repository","status":"404"}gh: Not Found (HTTP 404)
"""

[[tests.gh-api]]
name = "strips node_id and repo URLs from search items"
input = """{"total_count":2,"incomplete_results":false,"items":[{"id":1,"node_id":"MDEwOlJlcG9zaXRvcnkx","name":"cli","full_name":"jfrog/cli","html_url":"https://github.com/jfrog/cli","clone_url":"https://github.com/jfrog/cli.git","description":"JFrog CLI"},{"id":2,"node_id":"MDEwOlJlcG9zaXRvcnky","name":"other","full_name":"org/other","html_url":"https://github.com/org/other","clone_url":"https://github.com/org/other.git","description":"padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding"}]}
"""
expected = """{"total_count":2,"incomplete_results":false,"items":[{"id":1,"name":"cli","full_name":"jfrog/cli","description":"JFrog CLI"},{"id":2,"name":"other","full_name":"org/other","description":"padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding-padding"}]}"""

