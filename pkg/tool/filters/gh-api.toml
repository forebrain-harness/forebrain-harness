Long comment body that agents sometimes need in full on the first pass and keeps going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going and going"}]}"""

[[tests.gh-api]]
name = "pr commits json strips author node id, keeps message"
input = """{"commits":[{"authoredDate":"2026-07-04T15:23:03Z","authors":[{"email":"dev@example.com","id":"MDQ6VXNlcjEyMA==","login":"dev","name":"Dev User"}],"messageHeadline":"fix: handle blocked phase routing"}]}
"""
expected = """{"commits":[{"authoredDate":"2026-07-04T15:23:03Z","authors":[{"email":"dev@example.com","login":"dev","name":"Dev User"}],"messageHeadline":"fix: handle blocked phase routing"}]}"""

[[tests.gh-api]]
name = "org api json strips node_id and url fields"
input = """{"login":"JFROG","id":12,"node_id":"MDEyOk9yZ2FuaXphdGlvbjEy","url":"https://github.jfrog.info/api/v3/orgs/JFROG","repos_url":"https://github.jfrog.info/api/v3/orgs/JFROG/repos","description":"JFrog"}
"""
expected = """{"login":"JFROG","id":12,"description":"JFrog"}
"""

[[tests.gh-api]]
name = "team paginate json strips metadata, keeps slug and privacy"
input = """[{"id":1,"node_id":"MDQ6VGVhbTE=","url":"https://api.github.com/teams/1","name":"SRE","slug":"sre-team","description":"Platform SRE","privacy":"closed","permission":"pull"}]
"""
expected = """[{"id":1,"name":"SRE","slug":"sre-team","description":"Platform SRE","privacy":"closed","permission":"pull"}]
"""

[[tests.gh-api]]
