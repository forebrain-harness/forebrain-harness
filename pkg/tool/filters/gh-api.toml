[[tests.gh-api]]
name = "graphql review-thread body strips Fix-in-Cursor badge footer, keeps finding text"
input = """{"data":{"repository":{"pullRequest":{"reviewThreads":{"nodes":[{"isResolved":false,"path":"app/client.go","comments":{"nodes":[{"author":{"login":"cursor"},"body":"### Off-by-one in retry loop\\n\\nThe loop retries one time fewer than intended.\\n\\n<div><a href=\\"https://cursor.com/open?link=eyJ2ZXJzaW9uIjoxfQ\\" target=\\"_blank\\" rel=\\"noopener noreferrer\\"><picture><source media=\\"(prefers-color-scheme: dark)\\" srcset=\\"https://cursor.com/assets/images/fix-in-cursor-dark.png\\"><source media=\\"(prefers-color-scheme: light)\\" srcset=\\"https://cursor.com/assets/images/fix-in-cursor-light.png\\"><img alt=\\"Fix in Cursor\\" width=\\"115\\" height=\\"28\\" src=\\"https://cursor.com/assets/images/fix-in-cursor-dark.png\\"></picture></a>&nbsp;<a href=\\"https://cursor.com/agents?link=eyJ2ZXJzaW9uIjoxfQ\\" target=\\"_blank\\" rel=\\"noopener noreferrer\\">Open in Web</a></div>"}]}}]}}}}}
"""
expected = """{"data":{"repository":{"pullRequest":{"reviewThreads":{"nodes":[{"isResolved":false,"path":"app/client.go","comments":{"nodes":[{"author":{"login":"cursor"},"body":"### Off-by-one in retry loop\\n\\nThe loop retries one time fewer than intended.\\n\\n"}]}}]}}}}}"""

