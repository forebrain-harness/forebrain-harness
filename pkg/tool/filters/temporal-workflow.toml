[filters.temporal-workflow]
description = "Compact Temporal workflow JSON/history: trim payload noise, cap long histories."
version = "3"
match_command = "(?:temporal(?:ctl)?|temporal\\.sh)\\s+workflow\\s+(show|describe|list)\\b"
match_output_select = [
  "(?m)\"(?:type|eventType)\": \"EVENT_TYPE_",
  "(?m)\"eventId\":",
  "(?m)\"signalName\":",
  "(?m)\"status\": \"WORKFLOW_EXECUTION_STATUS_",
  "(?m)^terminating \\S",
  "(?m)^Workflow terminated$",
  "(?m)^pass=\\d+ latest_run=",
]
strip_ansi = true
replace = [
  { pattern = "\"data\": \"ey[A-Za-z0-9+/=]{20,}[^\"]*\"", replacement = "\"data\": \"[base64]\"" },
  { pattern = "\"data\": \"[A-Za-z0-9+/=]{24,}\"", replacement = "\"data\": \"[encoded]\"" },
]
strip_lines_matching = [
  "^\\s*\"encoding\":",
  "^\\s*\"sdkMetadata\": \\{\\s*\\},?\\s*$",
  "^\\s*\"meteringMetadata\": \\{\\s*\\},?\\s*$",
  "^\\s*\"workerVersion\":",
  "^\\s*\"buildId\":",
  "^\\s*\"namespaceId\":",
  "^\\s*\"retryPolicy\":",
  "^\\s*\"workflowRunTimeout\":",
  "^\\s*\"workflowTaskTimeout\":",
  "^\\s*\"inheritBuildId\":",
  "^\\s*\"historySizeBytes\":",
  "^\\s*\"attempt\": \\d+,?\\s*$",
  "^terminating \\S",
]
collapse_lines_matching = [
  { pattern = "^Workflow terminated$", template = "{count} workflows terminated" },
]
max_lines = 80
max_lines_keep_tail = 25

[[tests.temporal-workflow]]
name = "describe summary passes through compact"
input = """{
  "status": "WORKFLOW_EXECUTION_STATUS_COMPLETED",
  "closeTime": "2026-07-08T23:24:43.662962403Z",
  "pendingChildrenCount": 0,
  "pendingChildren": [],
  "historyLength": "196"
}
"""
expected = """{
  "status": "WORKFLOW_EXECUTION_STATUS_COMPLETED",
  "closeTime": "2026-07-08T23:24:43.662962403Z",
  "pendingChildrenCount": 0,
  "pendingChildren": [],
  "historyLength": "196"
}"""

