[[tests.temporal-workflow]]
name = "terminate loop: strip per-child lines, collapse Workflow terminated"
input = """pass=1 latest_run=019f43e4-518b pending_children=31
terminating LeadExecutionWorkflow lead-execution-abc 019f43e4-f484
Workflow terminated
terminating LeadExecutionWorkflow lead-execution-def 019f43e4-fa97
Workflow terminated
terminating LeadExecutionWorkflow lead-execution-ghi 019f43e4-ff54
Workflow terminated
pass=2 latest_run=019f43e4-518b status=WORKFLOW_EXECUTION_STATUS_COMPLETED pending_children=0
"""
expected = """pass=1 latest_run=019f43e4-518b pending_children=31
3 workflows terminated
pass=2 latest_run=019f43e4-518b status=WORKFLOW_EXECUTION_STATUS_COMPLETED pending_children=0"""

