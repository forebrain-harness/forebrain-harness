[filters.mvn-build]
description = "Compact Maven build output; keep errors, test counts, and the BUILD result tail."
version = "4"
match_command = "(^|[;&|]\\s*)(?:mvn\\s+(?:-[^\\s]+(?:\\s+[^-\\s][^\\s]*)?\\s+)*(?:compile|package|clean|install|test|verify|dependency:(?:go-offline|resolve|resolve-plugins|tree|get|list|purge-local-repository))|(?:\\./)?mvnw\\b)"
match_output_select = [
  '(?m)^\[INFO\] Building\s',
  '(?m)^(?:\[INFO\] )?Progress \(1\):',
  '(?m)^(?:\[INFO\] )?Downloading from ',
]
strip_ansi = true
strip_lines_matching = [
  "^\\[INFO\\] ---",
  "^\\[INFO\\] Building\\s",
  "^\\[INFO\\] Downloading\\s",
  "^\\[INFO\\] Downloaded\\s",
  "^\\[INFO\\]\\s*$",
  "^\\s*$",
  "^(?:\\[INFO\\] )?Downloading:",
  "^(?:\\[INFO\\] )?Downloaded:",
  "^(?:\\[INFO\\] )?Downloading from ",
  "^(?:\\[INFO\\] )?Downloaded from ",
  "^(?:\\[INFO\\] )?Progress",
  "^(?:\\./)?mvnw\\s",
]
replace = [
  { pattern = 'Progress \\(1\\):[^\\r\\n]*\\r?', replacement = "" },
]
max_lines = 60
max_lines_keep_tail = 40
on_empty = "mvn: ok"

[[tests.mvn-build]]
name = "strips INFO noise, preserves errors and summary"
input = """
[INFO] ---
[INFO] Building myapp 1.0-SNAPSHOT
[INFO] Downloading org.apache.maven.plugins:maven-compiler-plugin:3.11.0
[INFO] Downloaded org.apache.maven.plugins:maven-compiler-plugin:3.11.0
[INFO]
[ERROR] /src/main/java/Main.java:[10,5] cannot find symbol
  symbol: method foo()
[INFO] BUILD FAILURE
[INFO] Total time: 2.543 s
"""
expected = "[ERROR] /src/main/java/Main.java:[10,5] cannot find symbol\n  symbol: method foo()\n[INFO] BUILD FAILURE\n[INFO] Total time: 2.543 s"

[[tests.mvn-build]]
name = "successful build keeps BUILD SUCCESS line"
