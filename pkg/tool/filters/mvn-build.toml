# v4 regression tests for the dependency:* goals. These reproduce the exact
# shape seen in the SkillsBench run that motivated the change: bulk
# "Downloading from" / "Progress (1):" chatter surrounding a short useful tail.
[[tests.mvn-build]]
name = "dependency:go-offline download chatter stripped, result tail kept"
input = """[INFO] Scanning for projects...
Downloading from central: https://repo.maven.apache.org/maven2/org/x/a/1.0/a-1.0.jar
Progress (1): 4.1/12 kB
Progress (1): 12 kB
Downloaded from central: https://repo.maven.apache.org/maven2/org/x/a/1.0/a-1.0.jar (12 kB at 1.2 MB/s)
Downloading from central: https://repo.maven.apache.org/maven2/org/x/b/2.0/b-2.0.jar
Downloaded from central: https://repo.maven.apache.org/maven2/org/x/b/2.0/b-2.0.jar (8 kB at 900 kB/s)
[INFO] BUILD SUCCESS
[INFO] Total time:  9.187 s
"""
expected = """[INFO] Scanning for projects...
[INFO] BUILD SUCCESS
[INFO] Total time:  9.187 s"""

# The safety case. A dependency goal that FAILS must keep its [ERROR] recap:
# max_lines_keep_tail plus the never-strip-[ERROR] behaviour must hold for the
# newly matched goals exactly as it does for compile/package.
[[tests.mvn-build]]
name = "dependency:resolve failure keeps [ERROR] recap"
input = """[INFO] Scanning for projects...
Downloading from central: https://repo.maven.apache.org/maven2/org/x/missing/9.9/missing-9.9.jar
Progress (1): 1.0 kB
[ERROR] Failed to execute goal on project demo: Could not resolve dependencies
[ERROR] dependency: org.x:missing:jar:9.9 was not found
[ERROR] -> [Help 1]
"""
expected = """[INFO] Scanning for projects...
[ERROR] Failed to execute goal on project demo: Could not resolve dependencies
[ERROR] dependency: org.x:missing:jar:9.9 was not found
[ERROR] -> [Help 1]"""

# THE v4 CASE. Batch mode (`-B`) prefixes progress lines with `[INFO] `, which
# every download pattern used to miss because they anchored at `^Downloading`.
# Taken from real captured output (mvn dependency:resolve -B) that measured
# 51,727 -> 51,727 bytes, 0 saved, before this fix.
[[tests.mvn-build]]
name = "batch mode (-B): [INFO]-prefixed download chatter is stripped"
input = """[INFO] Scanning for projects...
[INFO] Downloading from central: https://repo.maven.apache.org/maven2/org/assertj/assertj-core/3.24/assertj-core-3.24.jar
[INFO] Downloaded from central: https://repo.maven.apache.org/maven2/org/assertj/assertj-core/3.24/assertj-core-3.24.jar (1.2 MB at 8.1 MB/s)
[INFO] Downloading from central: https://repo.maven.apache.org/maven2/io/zipkin/brave/brave/5.16/brave-5.16.jar
[INFO] Downloaded from central: https://repo.maven.apache.org/maven2/io/zipkin/brave/brave/5.16/brave-5.16.jar (0.6 MB at 4.0 MB/s)
