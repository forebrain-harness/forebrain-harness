[filters.git-pull]
description = "Cap git pull/merge fast-forward diffstat file lists; keep header and summary line."
version = "1"
match_command = "(^|[;&|]\\s*)(?:sudo\\s+)?git(?:\\s+(?:-[A-Za-z]\\S*|--\\S+))*\\s+(pull|merge)\\b"
match_output_select = [
  "(?m)^Fast-forward\\s*$",
  "(?m)^\\s*\\S.* \\|\\s+\\d+\\s+[+-]+\\s*$",
  "(?m)^\\s*\\d+ files? changed",
]
strip_ansi = true
max_lines = 40
max_lines_keep_tail = 5

[[tests.git-pull]]
name = "short fast-forward diffstat passes through unchanged"
input = """Updating 1234567..89abcde
Fast-forward
 app/client.go | 4 ++--
 app/server.go | 2 +-
 2 files changed, 3 insertions(+), 3 deletions(-)"""
expected = """Updating 1234567..89abcde
Fast-forward
 app/client.go | 4 ++--
 app/server.go | 2 +-
 2 files changed, 3 insertions(+), 3 deletions(-)"""

