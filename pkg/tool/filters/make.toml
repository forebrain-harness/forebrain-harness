[filters.make]
description = "Compact make output"
version = "1"
match_command = "^make\\b"
match_output_select = [
  '(?m)^make\[\d+\]: Entering',
  '(?m)^make\[\d+\]: Leaving',
  '(?m)^\[Compiling ',
  '(?m)^Nothing to be done',
]
strip_lines_matching = [
  "^make\\[\\d+\\]:",
  "^\\s*$",
  "^Nothing to be done",
]
max_lines = 50
on_empty = "make: ok"

[[tests.make]]
name = "strips entering/leaving lines"
input = """
make[1]: Entering directory '/home/user'
gcc -O2 foo.c
make[1]: Leaving directory '/home/user'
"""
expected = """
gcc -O2 foo.c
"""

[[tests.make]]
name = "strips blank lines"
input = """
gcc -O2 foo.c

gcc -O2 bar.c
"""
expected = """
gcc -O2 foo.c
gcc -O2 bar.c
"""

[[tests.make]]
name = "on_empty when all stripped"
input = """
make[1]: Entering directory '/home/user'
make[1]: Leaving directory '/home/user'
"""
expected = "make: ok"

[[tests.make]]
name = "mips makefile via output_select"
input = """
[Compiling dummy.c]
mipsel-linux-gnu-gcc-11 -c dummy.c -o build_mips/dummy.o
[Compiling am_map.c]
mipsel-linux-gnu-gcc-11 -c am_map.c -o build_mips/am_map.o
"""
expected = """
[Compiling dummy.c]
mipsel-linux-gnu-gcc-11 -c dummy.c -o build_mips/dummy.o
[Compiling am_map.c]
mipsel-linux-gnu-gcc-11 -c am_map.c -o build_mips/am_map.o
"""
