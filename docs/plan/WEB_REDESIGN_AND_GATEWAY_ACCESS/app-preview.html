<title>Forebrain Harness 全站预览</title>
<style>
  /* ---------- Page chrome (follows the viewer's theme) ---------- */
  :root {
    --pg-bg: #f4f5f7; --pg-card: #ffffff; --pg-text: #101828; --pg-text-2: #475467; --pg-muted: #667085; --pg-line: #e4e7ec;
    --pg-chip: #eef0f3; --pg-chip-on: #101828; --pg-chip-on-text: #ffffff;
    --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", "Microsoft YaHei", "Noto Sans SC", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --pg-bg: #0f1115; --pg-card: #171a20; --pg-text: #eceef2; --pg-text-2: #b4bac5; --pg-muted: #8a91a0; --pg-line: #2a2f38; --pg-chip: #232830; --pg-chip-on: #eceef2; --pg-chip-on-text: #0f1115; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --pg-bg: #0f1115; --pg-card: #171a20; --pg-text: #eceef2; --pg-text-2: #b4bac5; --pg-muted: #8a91a0; --pg-line: #2a2f38; --pg-chip: #232830; --pg-chip-on: #eceef2; --pg-chip-on-text: #0f1115; }
  body { background: var(--pg-bg); color: var(--pg-text); font-family: var(--ui); font-size: 14px; line-height: 1.6; }
  .wrap { max-width: 1360px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 56px; display: grid; gap: 16px; }
  .wrap > header h1 { margin: 0; font-size: 24px; line-height: 1.3; font-weight: 650; }
  .wrap > header p { margin: 6px 0 0; color: var(--pg-text-2); max-width: 78ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  .ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctl-label { font-size: 12px; color: var(--pg-muted); letter-spacing: 0.04em; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--pg-chip); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--pg-text-2); padding: 5px 11px; border-radius: 6px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--pg-chip-on); color: var(--pg-chip-on-text); }
  .seg button:focus-visible { outline: 2px solid var(--pg-text); outline-offset: 1px; }
  .stage { overflow-x: auto; border: 1px solid var(--pg-line); border-radius: 12px; background: var(--pg-card); }
  .caption { background: var(--pg-card); border: 1px solid var(--pg-line); border-radius: 12px; padding: 14px 18px; display: grid; gap: 6px; }
  .caption h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .caption ul { margin: 0; padding-left: 18px; color: var(--pg-text-2); display: grid; gap: 3px; }
  .caption code { font-family: var(--mono); font-size: 12.5px; }

  /* ---------- The app (product tokens; content always white) ---------- */
  .app {
    --page: #ffffff; --subtle: #f7f8fa; --soft: #f2f4f7; --soft-2: #eaecf0; --line: #e4e7ec; --line-2: #d0d5dd;
    --text: #101828; --text-2: #475467; --muted: #667085; --on-brand: #ffffff;
    --danger: #b42318; --success: #067647; --success-soft: #ecfdf3; --warning: #b54708; --warning-soft: #fffaeb; --code: #fafafa;
    --pop: 0 8px 24px rgba(16, 24, 40, 0.08);
    width: 1320px; height: 800px; display: flex; background: var(--page); color: var(--text);
    font-family: var(--ui); font-size: 13px; line-height: 1.55; position: relative; overflow: hidden;
  }
  .app[data-brand="navy"] { --brand: #1f4a9e; --brand-hover: #173b80; --brand-soft: #ebf0f9; --brand-border: #c3d2ec; }
  .app[data-brand="teal"] { --brand: #0e6e7e; --brand-hover: #0a5a67; --brand-soft: #e7f3f4; --brand-border: #b7dde2; }
  .app[data-brand="graphite"] { --brand: #1c1c1f; --brand-hover: #3a3a40; --brand-soft: #f1f1f2; --brand-border: #d4d4d8; }
  .app[data-brand="navy"][data-rail="dark"] :is(.rail, .t-menu) { --r-pop:#132447; --r-bg:#0f1d38; --r-fg:#e7ecf5; --r-fg2:#9fb0cc; --r-line:#1e3055; --r-hover:#172a4d; --r-active:#1d3563; --r-active-fg:#ffffff; --r-mark:#7ea2ea; --r-btn:#3a67c6; --r-btn-hover:#4a75d0; --r-btn-fg:#ffffff; --r-field:#152646; }
  .app[data-brand="navy"][data-rail="light"] :is(.rail, .t-menu) { --r-pop:#ffffff; --r-bg:#f3f5f9; --r-fg:#101828; --r-fg2:#475467; --r-line:#e1e5ec; --r-hover:#e8ecf3; --r-active:#e1e8f5; --r-active-fg:#1f4a9e; --r-mark:#1f4a9e; --r-btn:#1f4a9e; --r-btn-hover:#173b80; --r-btn-fg:#ffffff; --r-field:#ffffff; }
  .app[data-brand="teal"][data-rail="dark"] :is(.rail, .t-menu) { --r-pop:#112c31; --r-bg:#0d2429; --r-fg:#e4f0f1; --r-fg2:#97b7bb; --r-line:#1b393f; --r-hover:#143238; --r-active:#1a3f46; --r-active-fg:#ffffff; --r-mark:#6cc7d3; --r-btn:#16808f; --r-btn-hover:#1b90a0; --r-btn-fg:#ffffff; --r-field:#122e34; }
  .app[data-brand="teal"][data-rail="light"] :is(.rail, .t-menu) { --r-pop:#ffffff; --r-bg:#f1f6f6; --r-fg:#101828; --r-fg2:#475467; --r-line:#dfe7e8; --r-hover:#e6eeef; --r-active:#dcebed; --r-active-fg:#0e6e7e; --r-mark:#0e6e7e; --r-btn:#0e6e7e; --r-btn-hover:#0a5a67; --r-btn-fg:#ffffff; --r-field:#ffffff; }
  .app[data-brand="graphite"][data-rail="dark"] :is(.rail, .t-menu) { --r-pop:#1c1c1f; --r-bg:#141416; --r-fg:#ededef; --r-fg2:#a1a1a8; --r-line:#26262a; --r-hover:#1e1e21; --r-active:#2a2a2e; --r-active-fg:#ffffff; --r-mark:#ffffff; --r-btn:#ffffff; --r-btn-hover:#e4e4e7; --r-btn-fg:#141416; --r-field:#1c1c1f; }
  .app[data-brand="graphite"][data-rail="light"] :is(.rail, .t-menu) { --r-pop:#ffffff; --r-bg:#f6f6f7; --r-fg:#18181b; --r-fg2:#52525b; --r-line:#e4e4e7; --r-hover:#ececee; --r-active:#e6e6e8; --r-active-fg:#18181b; --r-mark:#18181b; --r-btn:#1c1c1f; --r-btn-hover:#3a3a40; --r-btn-fg:#ffffff; --r-field:#ffffff; }
  .app[data-rail="dark"] .rail { --mk-fill: #ffffff; --mk-glyph: var(--r-bg); }
  .app[data-rail="light"] .rail { --mk-fill: var(--brand); --mk-glyph: #ffffff; }
  .app svg.lucide { width: 15px; height: 15px; stroke-width: 1.75; flex: none; }
  .app button { font: inherit; color: inherit; }
  .app code, .app .mono { font-family: var(--mono); font-size: 12px; }

  /* rail */
  .rail { width: 264px; flex: none; background: var(--r-bg); color: var(--r-fg); border-right: 1px solid var(--r-line); display: flex; flex-direction: column; padding: 14px 12px 10px; gap: 10px; min-height: 0; position: relative; }
  .r-brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px 4px; cursor: pointer; }
  .r-brand .mk-fill { fill: var(--mk-fill); } .r-brand .mk-glyph { fill: var(--mk-glyph); }
  .r-brand .wm { font-size: 15px; line-height: 1.2; } .r-brand .wm b { font-weight: 650; }
  .r-brand small { display: block; font-size: 10px; color: var(--r-fg2); letter-spacing: 0.06em; margin-top: 2px; }
  .r-tenant { border: 1px solid var(--r-line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 1px; position: relative; }
  .r-tenant span { font-size: 11px; color: var(--r-fg2); } .r-tenant strong { font-size: 14px; font-weight: 600; }
  .r-tenant code { color: var(--r-fg2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-tenant svg.lucide { position: absolute; right: 8px; top: 12px; color: var(--r-fg2); width: 14px; height: 14px; }
  .r-new { display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 600; background: var(--r-btn); color: var(--r-btn-fg) !important; cursor: pointer; }
  .r-new:hover { background: var(--r-btn-hover); }
  .r-search { display: flex; align-items: center; gap: 7px; border: 1px solid var(--r-line); background: var(--r-field); border-radius: 8px; padding: 6px 9px; color: var(--r-fg2); font-size: 12.5px; }
  .r-cap { font-size: 11px; color: var(--r-fg2); letter-spacing: 0.06em; padding: 2px 8px 0; }
  .r-sessions { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; flex: 1; min-height: 0; overflow: auto; align-content: start; }
  .r-sessions li button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; color: var(--r-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; cursor: pointer; display: block; }
  .r-sessions li button:hover { background: var(--r-hover); color: var(--r-fg); }
  .r-sessions li button.on { background: var(--r-active); color: var(--r-active-fg); font-weight: 500; padding-right: 28px; }
  .r-sessions li button.on::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 2px; border-radius: 2px; background: var(--r-mark); }
  .r-sessions .hb { position: absolute; right: 8px; top: 8px; width: 13px; height: 13px; color: var(--r-mark); }
  .r-groups { border-top: 1px solid var(--r-line); padding-top: 6px; display: grid; gap: 1px; }
  .r-group-h { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; color: var(--r-fg); cursor: pointer; width: 100%; text-align: left; }
  .r-group-h:hover { background: var(--r-hover); }
  .r-group-h svg.lucide { color: var(--r-fg2); }
  .r-group-h .cnt { font-size: 11px; color: var(--r-fg2); }
  .r-group-h .chev { margin-left: auto; transition: transform 140ms ease; width: 14px; height: 14px; }
  .r-group-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .r-items { display: grid; gap: 1px; padding: 1px 0 4px; }
  .r-item { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; border-radius: 6px; padding: 5px 8px 5px 30px; color: var(--r-fg2); cursor: pointer; width: 100%; text-align: left; position: relative; }
  .r-item:hover { background: var(--r-hover); color: var(--r-fg); }
  .r-item.on { background: var(--r-active); color: var(--r-active-fg); font-weight: 500; }
  .r-item.on::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: var(--r-mark); }
  .r-item svg.lucide { width: 14px; height: 14px; }
  .r-foot { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--r-line); padding-top: 8px; }
  .r-foot .fl { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; color: var(--r-fg2); font-size: 12.5px; border: 0; background: transparent; cursor: pointer; }
  .r-foot .fl:hover { background: var(--r-hover); color: var(--r-fg); }
  .r-foot .fl.on { background: var(--r-active); color: var(--r-active-fg); }
  .r-foot .theme { margin-left: auto; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--r-line); color: var(--r-fg2); background: transparent; cursor: pointer; }
  .hb-pop { position: absolute; left: 12px; bottom: 50px; width: 300px; background: var(--page); color: var(--text); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--pop); padding: 14px; display: grid; gap: 10px; z-index: 5; }
  .hb-pop h4 { margin: 0; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .hb-pop p { margin: 0; font-size: 12px; color: var(--text-2); }

  /* work area */
  .work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px; border-bottom: 1px solid var(--line); flex: none; }
  .top .t { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .top .sp { flex: 1; }
  .chip-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; font-size: 12px; color: var(--text-2); background: var(--page); cursor: pointer; position: relative; }
  .chip-btn:hover { border-color: var(--line-2); color: var(--text); }
  .chip-btn[aria-pressed="true"] { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
  .chip-btn .badge-n { min-width: 16px; height: 16px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: 10.5px; line-height: 16px; text-align: center; padding: 0 4px; font-weight: 600; }
  .body { flex: 1; min-height: 0; display: flex; }
  .content { flex: 1; min-width: 0; overflow: auto; }

  /* shared content components */
  .pg { max-width: 1000px; margin: 0 auto; padding: 24px 28px 40px; display: grid; gap: 16px; align-content: start; }
  .ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .ph h1 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 650; }
  .ph p { margin: 4px 0 0; color: var(--text-2); max-width: 64ch; }
  .ph .acts { display: flex; gap: 8px; flex: none; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; align-content: start; background: var(--page); }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card-h h3 { margin: 0; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card-h .sub { font-size: 12px; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-side { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: 16px; align-items: start; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--page); color: var(--text); font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--soft); }
  .btn.pri { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
  .btn.pri:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
  .btn.dgr { color: var(--danger); border-color: var(--danger); }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
  .btn.link { border: 0; height: auto; padding: 0; color: var(--brand); background: transparent; }
  .field { height: 34px; border: 1px solid var(--line-2); border-radius: 6px; padding: 0 10px; font: inherit; font-size: 13px; color: var(--text); background: var(--page); width: 100%; box-sizing: border-box; }
  textarea.field { height: auto; padding: 8px 10px; line-height: 1.55; resize: vertical; }
  .field.mono { font-family: var(--mono); font-size: 12px; }
  select.field { appearance: none; background-image: none; }
  label.lb { display: grid; gap: 4px; font-size: 12px; color: var(--text-2); font-weight: 500; }
  .hint { font-size: 12px; color: var(--muted); }
  .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 500; background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
  .badge.gray { background: var(--soft); color: var(--text-2); }
  .badge.ok { background: var(--success-soft); color: var(--success); }
  .badge.warn { background: var(--warning-soft); color: var(--warning); }
  .badge.err { background: var(--page); color: var(--danger); border: 1px solid var(--danger); }
  .sw { width: 32px; height: 18px; border-radius: 999px; background: var(--line-2); position: relative; flex: none; border: 0; cursor: pointer; padding: 0; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #ffffff; transition: left 120ms ease; }
  .sw[aria-checked="true"] { background: var(--brand); }
  .sw[aria-checked="true"]::after { left: 16px; }
  .list { display: grid; }
  .list > .it { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .list > .it:first-child { border-top: 0; padding-top: 0; }
  .it .main { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .it .main b { font-weight: 600; }
  .it .main .s { color: var(--text-2); font-size: 12px; }
  .it .main .p { color: var(--muted); font-family: var(--mono); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  table.tb { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tb th { text-align: left; font-weight: 600; color: var(--text-2); background: var(--subtle); padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .tb td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tb tr:last-child td { border-bottom: 0; }
  .tb-wrap { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 12.5px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: transparent; padding: 8px 12px; font-size: 13px; color: var(--text-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
  .code { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.65; white-space: pre; overflow: auto; color: #111111; }
  .code .k { color: #b4196a; } .code .v { color: #a0770a; } .code .c { color: #75715e; }
  .note { border: 1px solid var(--line); border-left: 3px solid var(--warning); background: var(--warning-soft); border-radius: 6px; padding: 8px 12px; font-size: 12.5px; color: var(--text); }
  .radio-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .rc { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; background: var(--page); text-align: left; }
  .rc[aria-checked="true"] { border: 2px solid var(--brand); padding: 11px; }
  .rc i.swc { width: 28px; height: 28px; border-radius: 6px; flex: none; display: block; }
  .rc b { font-weight: 600; display: block; } .rc span { font-size: 12px; color: var(--muted); }

  /* chat */
  .chat { display: flex; flex-direction: column; height: 100%; }
  .thread { flex: 1; min-height: 0; overflow: auto; padding: 24px 0 8px; }
  .col { width: min(760px, 100% - 48px); margin: 0 auto; display: grid; gap: 16px; }
  .u { justify-self: end; max-width: 80%; background: var(--brand-soft); border-radius: 10px; padding: 9px 13px; }
  .a { display: grid; gap: 10px; } .a p { margin: 0; }
  .a code.inl { background: var(--subtle); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .tool { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tool-h { display: flex; align-items: center; gap: 8px; padding: 7px 11px; background: var(--subtle); border-bottom: 1px solid var(--line); font-size: 12px; }
  .tool-h b { font-weight: 600; } .tool-h code { color: var(--text-2); } .tool-h .ok { margin-left: auto; color: var(--success); font-size: 11.5px; }
  .tool pre { margin: 0; background: var(--code); padding: 9px 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; }
  .tool pre div { display: grid; grid-template-columns: 38px 1fr; white-space: pre; }
  .tool pre .ln { color: #9ca3af; text-align: right; padding-right: 12px; }
  .worked { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .worked::before { content: ""; width: 12px; height: 1px; background: var(--line-2); flex: none; }
  .worked::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
  .worked span { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
  .worked .plan-prog { white-space: nowrap; }
  .app .worked svg.pc { display: inline-block; width: 1em; height: 1em; margin-right: 0.2em; vertical-align: -0.14em; stroke-width: 2.25; color: var(--success); }
  .composer { flex: none; width: min(760px, 100% - 48px); margin: 0 auto 16px; border: 1px solid var(--line-2); border-radius: 12px; }
  .composer .ph-t { padding: 12px 14px 4px; color: var(--muted); min-height: 44px; }
  .composer .ph-t .ref { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 5px; background: var(--brand-soft); color: var(--brand); font-family: var(--mono); font-size: 12px; margin-right: 4px; }
  .composer .bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px 10px; }

  function treeHtml(path, depth) {

    else if (d.addmodel) { var am = d.addmodel.split(':'); S.models[+am[0]].push(am[1]); }
    else if (d.wstab) { S.wsTab = d.wstab; }
    else if (d.wstask !== undefined) { S.wsTask = Number(d.wstask); }
    else if (d.act === 'bench') { S.bench = !S.bench; }
    else if (d.act === 'hb') { var hb = !S.hb; closePops(); S.hb = hb; }
    else if (d.act === 'preset') { var pm = !S.presetMenu; closePops(); S.presetMenu = pm; }
    else if (d.preset) { S.preset = d.preset; S.presetMenu = false; }
    else if (d.act === 'railtheme') { S.rail = S.rail === 'dark' ? 'light' : 'dark'; }
    else if (d.act === 'newchat') { var list = sessionsOf(); S.page = 'chat'; S.projectSession = ''; S.session = list.length - 1; S.drawer = false; S.ref = ''; }
    else if (d.act === 'projform') { S.projectForm = !S.projectForm; }
    else if (d.stab) { S.settingsTab = d.stab; }
    else if (d.ptab) { S.projTab = d.ptab; }
    else if (d.brand) { S.brand = d.brand; }
    else if (d.rail) { S.rail = d.rail; }
    else if (d.tool) { S.toolOpen = S.toolOpen === d.tool ? '' : d.tool; }
    else if (d.file) { S.ref = d.file; }
    else if (d.dir) {
      var p = d.dir;
      if (S.tree[p]) { S.tree[p] = false; }
      else { S.tree[p] = true; if (!S.tree['_l_' + p]) { S.tree['_l_' + p] = true; S.treeLoading[p] = true; setTimeout(function () { S.treeLoading[p] = false; render(); }, 450); } }
    } else { return; }
    render();
  });
  render();
})();
</script>
