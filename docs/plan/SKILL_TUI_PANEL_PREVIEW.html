<div class="wrap">
  <header>
    <h1>终端 /skills 面板：草稿、发布与版本</h1>
    <p>终端里的技能面板设计稿。界面文字沿用终端的英文，颜色与符号照现有面板。点终端后可用键盘操作：↑/↓ 选择，Enter 确认，Esc 返回，Tab 切换标签，n/p 在改动页切换文件；也可以直接点行。左侧可跳到任一屏。</p>
  </header>
  <div class="main">
    <nav class="screens" id="screens" aria-label="屏幕"></nav>
    <div class="stage">
      <div class="term-wrap">
        <div class="term" id="term" tabindex="0" role="application" aria-label="终端预览">
          <div class="bar"><i></i><i></i><i></i><span>forebrain — ~/workspace/forebrain-harness</span></div>
          <div class="screen" id="screen"></div>
        </div>
      </div>
      <div class="keys" aria-label="按键">
        <span>按键</span>
        <button type="button" data-key="ArrowUp">↑</button><button type="button" data-key="ArrowDown">↓</button>
        <button type="button" data-key="Enter">Enter</button><button type="button" data-key="Escape">Esc</button>
        <button type="button" data-key="Tab">Tab</button><button type="button" data-key="n">n</button><button type="button" data-key="p">p</button>
        <button type="button" class="reset" id="reset">重置演示数据</button>
      </div>
      <section class="caption" id="caption" aria-live="polite"></section>
    </div>
  </div>
</div>
