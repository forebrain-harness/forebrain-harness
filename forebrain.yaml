# Forebrain Harness full example config.
# This file is intentionally verbose and documents the current settings in internal/config.
# Secret-like fields must use ${ENV_NAME} placeholders or stay empty, otherwise config.Load will reject the file.

# Default: derived per project — untrusted for untrusted projects, on-request otherwise.
# Example: explicit policy. Values: untrusted, on-request, never, granular, or the
# legacy alias on-failure (normalized to on-request). granular is an object with
# required sandbox_approval, rules, and mcp_elicitations fields.
approval_policy: "on-request"
# Default: "user". Values: user or auto_review (auto_review requires the guardian
# reviewer to be resolvable; see auto_review below).
approvals_reviewer: "user"
# Default: empty.
# Example: extra policy text appended to the guardian reviewer's prompt when
# approvals_reviewer is auto_review and a guardian LLM is configured. Free text,
# no fixed value set.
auto_review:
  policy: ""
gateway:
  # Default: 127.0.0.1:6060.
  # Example: local HTTP listen address for the Forebrain Harness gateway.
  http_addr: "127.0.0.1:6060"
  # Default: none.
  # Example: gateway auth settings.
  auth:
    # Default: token.
    # Example: token auth for the control plane.
    mode: "token"
    # Default: empty.
    # Example: token read from env.
    token: "${FOREBRAIN_GATEWAY_TOKEN}"
# Default when omitted: workspace-write for a trusted Git project; read-only
# for untrusted, unknown, or non-Git directories.
# Example: explicit sandbox mode override for model-generated commands.
sandbox_mode: "workspace-write"

# Defaults: empty writable_roots, network_access enabled (nil means true; unset
# does not cut the network), and both temporary roots included.
sandbox_workspace_write:
  writable_roots: []
  network_access: false
  exclude_tmpdir_env_var: false
  exclude_slash_tmp: false
  # isolated (default) uses per-project Forebrain Harness caches and the host download
  # cache as a read-only GOPROXY; shared directly exposes host Go caches;
  # disabled leaves Go's environment unchanged.
  go_cache_mode: "isolated"

# Named permission profiles are optional. When used, default_permissions selects
# one profile and sandbox_mode is not used. Built-ins are :read-only, :workspace,
# and :danger-full-access. User profile names cannot start with a colon.
#
# default_permissions: "development"
# permissions:
#   development:
#     description: "Workspace plus a shared cache"
#     extends: ":workspace"
#     workspace_roots:
#       "../shared": true
#     filesystem:
#       # Default: unset. Set a positive depth to bound deny-glob expansion.
#       glob_scan_max_depth: 4
#       ":workspace_roots":
#         ".": write
#         "**/.env": deny
#       "~/.cache/build/**": write
#     network:
#       # Default: false.
#       enabled: false
#       # Managed-proxy defaults: http://127.0.0.1:3128, SOCKS5 enabled at
#       # http://127.0.0.1:8081, SOCKS5 UDP enabled, upstream proxy allowed,
#       # full mode, local binding disabled, and dangerous allowances disabled.
#       proxy_url: "http://127.0.0.1:3128"
#       enable_socks5: true
#       socks_url: "http://127.0.0.1:8081"
#       enable_socks5_udp: true
#       allow_upstream_proxy: true
#       dangerously_allow_non_loopback_proxy: false
#       dangerously_allow_all_unix_sockets: false
#       mode: "full"
#       domains:
#         "example.com": allow
#         "blocked.example": deny
#       unix_sockets:
#         "/var/run/example.sock": allow
#       allow_local_binding: false
#       # Default: none. MITM interception hooks for the managed proxy;
#       # only permission-profile networks have this, the features.network_proxy
#       # object form does not.
#       mitm:
#         # Default: none. Strip these request headers before forwarding.
#         strip_request_headers:
#           - "Authorization"
#         # Default: none. Inject headers, optionally per host/method/path match.
#         inject_headers:
#           - name: "X-Static-Token"
#             value: "${MITM_TOKEN}"
#             host: "api.example.com"
#         # Default: none. Trigger outbound HTTP hooks on matching requests.
#         hooks:
#           - url: "http://127.0.0.1:9999/mitm"
#             host: "api.example.com"
#             method: "POST"
#             path: "/v1/upload"

# Permission-expansion and managed-network features default to false; memories,
# skill offering, and language servers default to true.
features:
  exec_permission_approvals: false
  request_permissions_tool: false
  # A boolean enables the managed proxy with profile/default settings. The
  # object form accepts enabled plus the proxy_url, SOCKS5, mode, domains,
  # unix_sockets, local-binding, upstream-proxy, and dangerous-listener fields
  # shown under a permission profile above (it has no mitm sub-object).
  # network_proxy:
  #   enabled: true
  #   proxy_url: "http://127.0.0.1:3128"
  #   enable_socks5: true
  #   socks_url: "http://127.0.0.1:8081"
  #   enable_socks5_udp: true
  #   allow_upstream_proxy: true
  #   dangerously_allow_non_loopback_proxy: false
  #   dangerously_allow_all_unix_sockets: false
  #   mode: "full"
  #   domains:
  #     "example.com": allow
  #   unix_sockets:
  #     "/var/run/example.sock": allow
  #   allow_local_binding: false
  network_proxy: false
  # Default: true. Enables memory use, generation, tools, and /memories.
  # Explicitly disabled here; the memories: section below is then inert.
  memories: false
  # Default: true. Shows the standing offer to capture a workflow as a skill.
  skill_offer: true
  # Default: true. Master switch for language-server code intelligence; the
  # lsp: section below only takes effect while this is true.
  lsp: true

# Windows sandbox selection defaults to disabled (sandbox empty). When enabled
# with unelevated or elevated, private desktop defaults to true.
windows:
  # Default: empty, which disables the sandbox. Values: unelevated or elevated.
  sandbox: ""
  sandbox_private_desktop: true

# Default: automatic and manual replacement-history compaction.
compact:
  # Default: 0, meaning the model's automatic-compaction limit (at most 90% of
  # its context window). A positive value triggers compaction earlier and is
  # clamped to that 90% ceiling; negative values are rejected at load.
  model_auto_compact_token_limit: 0
  # Default: total. Also accepts body_after_prefix.
  model_auto_compact_token_limit_scope: "total"
  # Default: empty, which uses the built-in local-compaction handoff prompt.
  # Example: override the prompt a compaction checkpoint hands to the model.
  prompt: ""
  # Default: false. Local summarization builds a checkpoint out of plain messages,
  # so a session can keep switching provider and model across rounds.
  # Provider-native compaction instead stores an opaque item only the issuing
  # provider can replay: after switching provider that checkpoint is unusable and
  # the session falls back to re-reading its whole history every round.
  # Enable this only when the session stays on a single provider.
  remote_compaction: false
  # Default: true. Only consulted when remote_compaction is enabled.
  # OpenAI Responses uses the normal /responses endpoint with a compaction trigger.
  # Set false only when the provider requires the legacy /responses/compact protocol.
  remote_compaction_v2: true

# Default: none.
# Example: agent defaults and named definitions.
agents:
  # Default: none.
  # Example: defaults inherited by agent definitions.
  defaults:
    # Default: off (false). Opt-in switch for the model-visible subagent_*
    # tools; enabling it registers the typed-subagent tool set.
    enable_subagent: false
    # Default: max(0, CPU cores - 1). Upper bound on concurrently running
    # subagents; a negative value clamps to 0.
    # execution:
    #   max_parallel_subagents: 7
    # Default: none.
    # Example: context injection and bootstrap settings.
    context_inject:
      # Workspace rules are always injected via the pre-hook and always chain
      # up the directory tree (git-root → CWD); rule injection is no longer
      # configurable.
      # Default: none; helper callers provide their own fallback.
      # Example: cap rendered rule chars before pre-hook injection.
      max_pre_hook_rules_chars: 8000
      # Default: none.
      # Example: explicit model context window in tokens.
      model_context_tokens: 128000
      # Default: 25000 when persisted; 0 or unset at runtime means no warning.
      # Example: warn once remaining tokens drop below this threshold.
      warn_remaining_tokens: 8000
      # Default: 13000 when persisted; 0 or unset at runtime never blocks.
      # Example: remaining tokens below this enter the "block" pressure tier.
      block_remaining_tokens: 13000
    # Default: none.
    # Example: declarative MCP server registry used by agents.
    mcp_servers:
      - # Default: empty.
        # Example: logical server name.
        name: "demo_stdio"
        # Default: empty.
        # Example: transport kind such as stdio or sse.
        transport: "stdio"
        # Default: empty.
        # Example: URL for non-stdio transports; kept here as a reference even for stdio.
        url: "http://127.0.0.1:8787/sse"
        # Default: none.
        # Example: HTTP headers for network transports.
        headers:
          Authorization: "Bearer ${MCP_DEMO_HTTP_TOKEN}"
          X-Workspace: "forebrain"
        # Default: none.
        # Example: OAuth token source settings for this MCP server.
        oauth:
          # Default: empty; runtime infers from access_token / refresh_token / client_id+token_url when omitted.
          # Example: current accepted modes are none, static, bearer, refresh, client_credentials.
          mode: "refresh"
          # Default: empty.
          # Example: cached access token from env.
          access_token: "${MCP_DEMO_ACCESS_TOKEN}"
          # Default: empty.
          # Example: oauth token type.
          token_type: "Bearer"
          # Default: empty.
          # Example: oauth client id.
          client_id: "demo-client-id"
          # Default: empty.
          # Example: oauth client secret from env.
          client_secret: "${MCP_DEMO_CLIENT_SECRET}"
          # Default: empty.
          # Example: token endpoint.
          token_url: "https://auth.example.com/oauth/token"
          # Default: empty.
          # Example: authorization endpoint.
          authorization_url: "https://auth.example.com/oauth/authorize"
          # Default: empty.
          # Example: redirect URL.
          redirect_url: "http://127.0.0.1:8787/callback"
          # Default: empty.
          # Example: refresh token from env.
          refresh_token: "${MCP_DEMO_REFRESH_TOKEN}"
          # Default: none.
          # Example: oauth scopes.
          scopes:
            - "read"
            - "write"
        # Default: false when omitted.
        # Example: disable standalone SSE fallback.
        disable_standalone_sse: false
        # Default: empty.
        # Example: stdio command for local MCP launch; use an absolute path when expected_command_sha256 is set.
        command: "/absolute/path/to/npx"
        # Default: none.
        # Example: stdio args.
        args:
          - "-y"
          - "@modelcontextprotocol/server-everything"
        # Default: none.
        # Example: environment variables passed to the MCP child process.
        env:
          MCP_TOKEN: "${MCP_TOKEN}"
          LOG_LEVEL: "info"
        # Default: false when omitted.
        # Example: inherit parent env into the MCP child process.
        inherit_parent_env: true
        # Default: empty.
        # Example: pinned command binary hash; when set, command must be an absolute path.
        expected_command_sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        # Default: auto. Approval tier for every tool of this server: auto,
        # prompt, writes, or approve; an unrecognized value falls back to auto.
        default_tools_approval_mode: "auto"
        # Default: none; each tool inherits default_tools_approval_mode. Map a
        # tool by name to an approval_mode to override just that one.
        # tools:
        #   "search":
        #     approval_mode: "prompt"
        # Default: 0, which the runtime reads as 30 seconds. Startup plus
        # first-listTools patience in (fractional) seconds; not part of the
        # server fingerprint.
        startup_timeout: 30
        # Default: false. A required server's failure fails unattended runs
        # outright instead of degrading to the remaining servers.
        required: false
      - # Default: empty.
        # Example: second server demonstrating SSE transport.
        name: "demo_sse"
        # Default: empty.
        # Example: SSE transport.
        transport: "sse"
        # Default: empty.
        # Example: SSE endpoint.
        url: "https://mcp.example.com/events"
        # Default: none.
        # Example: auth headers.
        headers:
          Authorization: "Bearer ${MCP_SSE_TOKEN}"
        # Default: none.
        # Example: OAuth token source settings for this MCP server.
        oauth:
          # Default: empty; runtime infers from access_token / refresh_token / client_id+token_url when omitted.
          # Example: explicitly disable OAuth for this server.
          mode: "none"
          # Default: empty.
          # Example: unused placeholder.
          access_token: "${MCP_SSE_ACCESS_TOKEN}"
          # Default: empty.
          # Example: token type placeholder.
          token_type: "Bearer"
          # Default: empty.
          # Example: unused placeholder.
          client_id: "mcp-sse-client"
          # Default: empty.
          # Example: unused placeholder.
          client_secret: "${MCP_SSE_CLIENT_SECRET}"
          # Default: empty.
          # Example: unused placeholder.
          token_url: "https://mcp.example.com/oauth/token"
          # Default: empty.
          # Example: unused placeholder.
          authorization_url: "https://mcp.example.com/oauth/authorize"
          # Default: empty.
          # Example: unused placeholder.
          redirect_url: "http://127.0.0.1:9999/callback"
          # Default: empty.
          # Example: unused placeholder.
          refresh_token: "${MCP_SSE_REFRESH_TOKEN}"
          # Default: none.
          # Example: unused placeholder.
          scopes:
            - "events"
        # Default: false when omitted.
        # Example: disable standalone SSE bootstrap.
        disable_standalone_sse: true
        # Default: empty.
        # Example: unused placeholder for non-stdio transport.
        command: "unused-for-sse"
        # Default: none.
        # Example: unused placeholder args.
        args:
          - "unused"
        # Default: none.
        # Example: unused placeholder env map.
        env:
          UNUSED_ENV: "1"
        # Default: false when omitted.
        # Example: unused placeholder for sse transport.
        inherit_parent_env: false
        # Default: empty.
        # Example: unused placeholder hash.
        expected_command_sha256: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
    # Default: none.
    # Example: input/output/retrieval guardrails.
    guardrails:
      # Default: none.
      # Example: input filtering guardrails.
      input:
        # Default: 200000.
        # Example: max input runes before truncation or rejection logic.
        max_runes: 200000
        # Default: none.
        # Example: hard-block substrings.
        block_substrings:
          - "DROP TABLE"
          - "rm -rf /"
      # The input and retrieval rails are always on and cannot be disabled;
      # the output rail is on unless explicitly disabled here.
      # Default: unset (nil), which keeps the output rail enabled.
      output:
        # Example: the only rail that can be turned off.
        enabled: true
      # Default: none.
      # Example: retrieval guardrails.
      retrieval:
        # Default: 120000.
        # Example: max retrieval chunk size in runes.
        max_chunk_runes: 120000
    # Default: none.
    # Example: token estimation settings.
    token_estimate:
      # Default: empty; runtime falls back to first active model or cl100k_base.
      # Example: explicit tokenizer encoding.
      encoding: "cl100k_base"
      # Default: empty; runtime infers from active agent provider when possible.
      # Example: model used for token counting heuristics.
      model: "gpt-4.1"
      # Default: empty. Path to a HuggingFace tokenizer.json; when set it takes
      # precedence over encoding and model.
      tokenizer_path: ""
    # Default: none.
    # Example: web search provider settings.
    web_search:
      # Default: empty behaves like auto in current code.
      # Example: auto, tavily, brave, or baidu.
      provider: "auto"
      # Default: none.
      # Example: Tavily-specific settings.
      tavily:
        # Default: empty.
        # Example: Tavily API key from env.
        api_key: "${TAVILY_API_KEY}"
        # Default: basic unless explicitly set to advanced.
        # Example: Tavily search depth.
        search_depth: "advanced"
      # Default: none.
      # Example: Brave-specific settings.
      brave:
        # Default: empty.
        # Example: Brave Search API key from env.
        api_key: "${BRAVE_SEARCH_API_KEY}"
      # Default: none.
      # Example: Baidu-specific settings.
      baidu:
        # Default: empty.
        # Example: Baidu web search API key from env.
        api_key: "${BAIDU_WEB_SEARCH_API_KEY}"
    # Default: none.
    # Example: web_fetch tool settings.
    web_fetch:
      # Default: false, so web_fetch reaches public hosts only.
      # Example: true lets it reach loopback and RFC1918 hosts, for fetching a
      # local dev server. This is an operator setting and is not exposed to the
      # model, because fetched pages can carry instructions. Link-local and
      # cloud metadata addresses (169.254.169.254, metadata.google.internal)
      # stay blocked either way, and every private fetch still asks for
      # approval.
      allow_private_ip: false
  # Default: none.
  # Example: named agent definitions.
  definitions:
    # Default: auto-created when omitted.
    # Example: primary coding agent definition.
    main:
      # Default: false; the definition named "main" is always primary regardless.
      # Example: mark the tenant's primary agent — the only one that may carry channels.
      primary: true
      # Default: empty.
      # Example: roster display name for the primary agent.
      display_name: ""
      # Default: empty.
      # Example: short description shown when switching agents.
      description: ""
      # Default: none.
      # Example: primary LLM provider chain.
      llm_providers:
        - # Default: empty.
          # Example: provider name.
          provider: "openai"
          # Default: empty. Also accepts a list of model names, expanded into
          # one chain entry per model.
          # Example: model name.
          model: "gpt-4.1"
          # Default: empty; env overrides also apply.
          # Example: provider API key from env.
          api_key: "${OPENAI_API_KEY}"
          # Default: empty; env overrides also apply.
          # Example: OpenAI-compatible base URL.
          base_url: "https://api.openai.com"
          # Default: empty.
          # Example: API path.
          api_path: "/v1/chat/completions"
          # Default: none.
          # Example: provider-native JSON object merged into the request body.
          params:
            temperature: 0.2
            max_output_tokens: 4096
            top_p: 1
            reasoning:
              effort: xhigh
      # Default: none.
      # Example: this primary agent's delivery channels. Channels are per
      # primary agent: an inbound message from one of these bots starts a
      # session that belongs to this agent, and another primary agent
      # configures its own, separate accounts under its own definition.
      # Secrets are referenced through agent-scoped env names so two agents
      # running the same kind of channel cannot share one variable.
      channels:
        # Default: none.
        # Example: WeCom primary callback integration.
        wecom:
          # Default: false.
          # Example: enable enterprise WeCom callback handling.
          enabled: false
          # Default: empty.
          # Example: channel callback token from env.
          token: "${FOREBRAIN_MAIN_WECOM_TOKEN}"
          # Default: empty.
          # Example: WeCom encoding AES key from env.
          encoding_aes_key: "${FOREBRAIN_MAIN_WECOM_ENCODING_AES_KEY}"
          # Default: empty.
          # Example: enterprise corp id.
          corp_id: "ww1234567890abcdef"
          # Default: empty.
          # Example: enterprise corp secret from env.
          corp_secret: "${FOREBRAIN_MAIN_WECOM_CORP_SECRET}"
          # Default: 0.
          # Example: enterprise application id.
          agent_id: 1000002
          # Default: /wecom/callback.
          # Example: inbound callback path exposed by Forebrain Harness.
          callback_path: "/wecom/callback"

        # Default: none.
        # Example: alternate WeCom callback integration.
        wecom_callback:
          # Default: false.
          # Example: enable the alternate WeCom callback surface.
          enabled: false
          # Default: empty.
          # Example: callback token from env.
          token: "${FOREBRAIN_MAIN_WECOM_CALLBACK_TOKEN}"
          # Default: empty.
          # Example: callback AES key from env.
          encoding_aes_key: "${FOREBRAIN_MAIN_WECOM_CALLBACK_ENCODING_AES_KEY}"
          # Default: empty.
          # Example: callback corp id.
          corp_id: "wwfedcba0987654321"
          # Default: empty.
          # Example: callback corp secret from env.
          corp_secret: "${FOREBRAIN_MAIN_WECOM_CALLBACK_CORP_SECRET}"
          # Default: 0.
          # Example: callback agent id.
          agent_id: 1000003
          # Default: /wecom_callback/callback.
          # Example: alternate callback path.
          callback_path: "/wecom_callback/callback"

        # Default: none.
        # Example: Telegram integration.
        telegram:
          # Default: false.
          # Example: enable Telegram bot ingress.
          enabled: false
          # Default: empty.
          # Example: Telegram bot token from env.
          bot_token: "${FOREBRAIN_MAIN_TELEGRAM_BOT_TOKEN}"

        # Default: none.
        # Example: Discord integration.
        discord:
          # Default: false.
          # Example: enable Discord bot ingress.
          enabled: false
          # Default: empty.
          # Example: Discord bot token from env.
          bot_token: "${FOREBRAIN_MAIN_DISCORD_BOT_TOKEN}"

        # Default: none.
        # Example: Slack integration.
        slack:
          # Default: false.
          # Example: enable Slack channel integration.
          enabled: false
          # Default: /channels/slack/inbound.
          # Example: inbound webhook route.
          inbound_path: "/channels/slack/inbound"
          # Default: empty.
          # Example: outbound bridge URL.
          outbound_url: "https://slack-bridge.example.com/outbound"
          # Default: empty.
          # Example: Slack bot token from env.
          bot_token: "${FOREBRAIN_MAIN_SLACK_BOT_TOKEN}"
          # Default: empty.
          # Example: Slack signing secret from env.
          secret: "${FOREBRAIN_MAIN_SLACK_SECRET}"

        # Default: none.
        # Example: WhatsApp integration.
        whatsapp:
          # Default: false.
          # Example: enable WhatsApp bridge integration.
          enabled: false
          # Default: /channels/whatsapp/inbound.
          # Example: inbound webhook route.
          inbound_path: "/channels/whatsapp/inbound"
          # Default: http://127.0.0.1:3000.
          # Example: outbound bridge URL.
          outbound_url: "http://127.0.0.1:3000"
          # Default: empty.
          # Example: WhatsApp token from env.
          token: "${FOREBRAIN_MAIN_WHATSAPP_TOKEN}"
          # Default: empty.
          # Example: WhatsApp secret from env.
          secret: "${FOREBRAIN_MAIN_WHATSAPP_SECRET}"

        # Default: none.
        # Example: Signal integration.
        signal:
          # Default: false.
          # Example: enable Signal bridge integration.
          enabled: false
          # Default: empty.
          # Example: outbound bridge URL.
          outbound_url: "https://signal-bridge.example.com/outbound"
          # Default: empty.
          # Example: Signal token from env.
          token: "${FOREBRAIN_MAIN_SIGNAL_TOKEN}"

        # Default: none.
        # Example: Mattermost integration.
        mattermost:
          # Default: false.
          # Example: enable Mattermost bridge integration.
          enabled: false
          # Default: empty.
          # Example: outbound bridge URL.
          outbound_url: "https://mattermost.example.com/hooks/outbound"
          # Default: empty.
          # Example: Mattermost token from env.
          token: "${FOREBRAIN_MAIN_MATTERMOST_TOKEN}"

        # Default: none.
        # Example: Matrix integration.
        matrix:
          # Default: false.
          # Example: enable Matrix bridge integration.
          enabled: false
          # Default: empty.
          # Example: outbound bridge URL.
          outbound_url: "https://matrix.example.com/outbound"
          # Default: empty.
          # Example: Matrix token from env.
          token: "${FOREBRAIN_MAIN_MATRIX_TOKEN}"

        # Default: none.
        # Example: Home Assistant integration.
        homeassistant:
          # Default: false.
          # Example: enable Home Assistant bridge integration.
          enabled: false
          # Default: http://homeassistant.local:8123.
          # Example: Home Assistant base URL.
          outbound_url: "http://homeassistant.local:8123"
          # Default: empty.
          # Example: Home Assistant access token from env.
          token: "${FOREBRAIN_MAIN_HOMEASSISTANT_TOKEN}"

        # Default: none.
        # Example: Email integration.
        email:
          # Default: false.
          # Example: enable email ingress/egress.
          enabled: false
          # Default: /channels/email/inbound.
          # Example: inbound route.
          inbound_path: "/channels/email/inbound"
          # Default: empty.
          # Example: outbound gateway URL.
          outbound_url: "https://mail-bridge.example.com/outbound"
          # Default: empty.
          # Example: email channel token from env.
          token: "${FOREBRAIN_MAIN_EMAIL_CHANNEL_TOKEN}"
          # Default: empty.
          # Example: email channel secret from env.
          secret: "${FOREBRAIN_MAIN_EMAIL_CHANNEL_SECRET}"

        # Default: none.
        # Example: SMS integration.
        sms:
          # Default: false.
          # Example: enable SMS ingress/egress.
          enabled: false
          # Default: /channels/sms/inbound.
          # Example: inbound route.
          inbound_path: "/channels/sms/inbound"
          # Default: empty.
          # Example: outbound SMS bridge URL.
          outbound_url: "https://sms-bridge.example.com/outbound"
          # Default: empty.
          # Example: SMS channel token from env.
