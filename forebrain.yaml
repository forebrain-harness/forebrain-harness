    # Default: falls back to the "main" agent's providers when omitted.
    # Example: every built-in typed subagent — general-purpose, explore, plan,
    # and verification, the four names agent.PublicTypeNames() returns — can run
    # on its own provider, model and request params, configured here under its
    # own type name. A type with no llm_providers entry transparently uses the
    # main agent's LLM, so you only configure the ones you want to move.
    #
    # The provider chain and params are read exactly like the main agent's: the
    # first entry is the model the type runs on, and params is the same
    # provider-native JSON object, so reasoning effort is per type as well. The
    # subagent's own alt-screen view names the model and effort it resolved to,
    # which is how you confirm a type actually moved.
    #
    # Typical split: read-only exploration on a cheap, fast model; planning and
    # verification on a stronger one; the main agent untouched.
    explore:
      llm_providers:
        - provider: "openai"
          model: "gpt-4.1-mini"
          api_key: "${OPENAI_API_KEY}"
          base_url: "https://api.openai.com"
          api_path: "/v1/chat/completions"
          # Default: none.
          # Example: exploration is broad and shallow, so it reads cheaply.
          params:
            temperature: 0
            reasoning:
              effort: low
    # Default: falls back to the "main" agent's providers when omitted.
    # Example: plan subagent with a dedicated provider.
    plan:
      llm_providers:
        - provider: "openai"
          model: "gpt-4.1"
          api_key: "${OPENAI_API_KEY}"
          base_url: "https://api.openai.com"
          api_path: "/v1/chat/completions"
          # Default: none.
          # Example: planning is where reasoning effort pays for itself.
          params:
            temperature: 0.2
            reasoning:
              effort: high
    # Default: falls back to the "main" agent's providers when omitted.
    # Example: verification subagent with a dedicated provider.
    verification:
      llm_providers:
        - provider: "openai"
          model: "gpt-4.1"
          api_key: "${OPENAI_API_KEY}"
          base_url: "https://api.openai.com"
          api_path: "/v1/chat/completions"
          # Default: none.
          # Example: verification judges finished work, so it reasons but does
          # not need to be creative.
          params:
            temperature: 0
            reasoning:
              effort: high
    # Default: falls back to the "main" agent's providers when omitted.
    # Example: general-purpose subagent with a dedicated provider. This is the
    # type an unnamed subagent falls back to, so keep it close to the main
    # agent's model rather than a cheap one.
    general-purpose:
      llm_providers:
        - provider: "openai"
          model: "gpt-4.1"
          api_key: "${OPENAI_API_KEY}"
          base_url: "https://api.openai.com"
          api_path: "/v1/chat/completions"
          # Default: none.
          # Example: same shape as the main agent's params.
          params:
            temperature: 0.2
            reasoning:
              effort: medium
    # Default: none.
    # Example: secondary review-focused agent definition.
    reviewer:
      # Default: none.
      # Example: secondary agent role.
      role: "Reviewer"
      # Default: none.
      # Example: secondary agent goal.
      goal: "Review changes for bugs, regressions, and missing tests"
      # Default: none.
      # Example: secondary agent backstory.
      backstory: "You prioritize findings over summaries."
      # Default: none.
      # Example: reviewer LLM provider chain.
      llm_providers:
        - # Default: empty.
          # Example: provider name.
          provider: "openai"
          # Default: empty.
          # Example: model name.
          model: "gpt-4.1-mini"
          # Default: empty; env overrides also apply.
          # Example: provider API key from env.
          api_key: "${OPENAI_API_KEY}"
          # Default: empty; env overrides also apply.
          # Example: OpenAI-compatible base URL.
          base_url: "https://api.openai.com"
          # Default: empty.
          # Example: API path.
          api_path: "/v1/chat/completions"
          # Default: none.
          # Example: top-level params alias accepted by current unmarshal code; merged into config.params when config.params is empty.
          params:
            temperature: 0
            max_tokens: 2048
# Default: none.
# Example: persistent host hooks by lifecycle event.
hooks:
  # Default: no matchers.
  # Example: hook chain before tool execution.
  PreToolUse:
    - # Default: empty.
      # Example: sample matcher that is unlikely to fire accidentally.
      matcher: "sample_tool(*)"
      # Default: none.
      # Example: hooks executed for the matcher.
      hooks:
        - # Default: empty.
          # Example: command hook.
          type: "command"
          # Default: empty.
          # Example: benign command to run.
          command: "printf pretool"
          # Default: empty.
          # Example: permission-rule style condition.
          if: "sample_tool(*)"
          # Default: empty.
          # Example: shell interpreter.
          shell: "bash"
          # Default: 0.
          # Example: timeout in seconds.
          timeout: 3
          # Default: empty.
          # Example: short status text.
          status_message: "pre tool sample"
          # Default: false.
          # Example: run only once.
          once: false
          # Default: false.
          # Example: async toggle.
          async: false
          # Default: false.
          # Example: async rewake toggle.
          async_rewake: false
          # Default: empty.
          # Example: model id used by prompt/agent hook hosts that honor it.
          model: "gpt-4.1-mini"
          # Default: none.
          # Example: outbound headers for HTTP-capable hook runners.
          headers:
            X-Sample: "pretool"
          # Default: none.
          # Example: env allowlist forwarded to the hook process.
          allowed_env_vars:
            - "HOME"
            - "PATH"
  # Default: no matchers.
  # Example: hook chain after successful tool execution.
  PostToolUse:
    - matcher: "sample_tool(*)"
      # Default: none.
      # Example: hooks executed for the matcher.
      hooks:
        - type: "prompt"
          # Default: empty.
          # Example: prompt sent to the host prompt-hook engine.
          prompt: "Summarize the sample tool result."
          if: "sample_tool(*)"
          timeout: 3
          status_message: "post tool sample"
          once: false
          async: false
          async_rewake: false
          model: "gpt-4.1-mini"
          # Default: none.
          # Example: outbound headers for HTTP-capable hook runners.
          headers:
            X-Sample: "posttool"
          # Default: none.
          # Example: env allowlist forwarded to the hook process.
          allowed_env_vars:
            - "HOME"
  # Default: no matchers.
  # Example: hook chain after failed tool execution.
  PostToolUseFailure:
    - matcher: "sample_tool(*)"
      # Default: none.
      # Example: hooks executed for the matcher.
      hooks:
        - type: "agent"
          prompt: "Review the failed sample tool call and suggest the next action."
          if: "sample_tool(*)"
          timeout: 5
          status_message: "post failure sample"
          once: false
          async: false
          async_rewake: false
          model: "gpt-4.1-mini"
          # Default: none.
          # Example: outbound headers for HTTP-capable hook runners.
          headers:
            X-Sample: "postfailure"
          # Default: none.
          # Example: env allowlist forwarded to the hook process.
          allowed_env_vars:
            - "HOME"
  # Default: no matchers.
  # Example: hook chain for general notifications.
  Notification:
    - matcher: "notify(*)"
      # Default: none.
      # Example: hooks executed for the matcher.
      hooks:
        - type: "http"
          # Default: empty.
          # Example: webhook target.
          url: "http://127.0.0.1:9999/hooks/sample"
          if: "notify(*)"
          timeout: 3
          status_message: "notification sample"
          once: false
          async: true
          async_rewake: true
          model: "gpt-4.1-mini"
          # Default: none.
          # Example: outbound headers for the HTTP hook call.
          headers:
            Authorization: "Bearer ${HOOK_NOTIFICATION_TOKEN}"
            X-Sample: "notification"
          # Default: none.
          # Example: env allowlist forwarded to the hook process.
          allowed_env_vars:
            - "HOME"
  # Default: no matchers.
  # Example: hook chain when the user submits input.
  UserPromptSubmit:
    - matcher: "user_prompt(*)"
      # Default: none.
      # Example: hooks executed for the matcher.
      hooks:
        - type: "command"
          command: "printf userprompt"
          if: "user_prompt(*)"
          shell: "bash"
          timeout: 3
          status_message: "user prompt sample"
          once: false
          async: false
          async_rewake: false
          model: "gpt-4.1-mini"
          # Default: none.
          # Example: outbound headers for HTTP-capable hook runners.
          headers:
            X-Sample: "userprompt"
          # Default: none.
          # Example: env allowlist forwarded to the hook process.
          allowed_env_vars:
            - "HOME"
    # caveman-stats 钩子。
    # 作用：
    #   1) /caveman-stats          —— 拦截命令，运行 caveman-stats.py 读取
    #      $FOREBRAIN_HOME/state/forebrain.state.sqlite 中 fb_runs 表的真实 token
    #      用量与本会话 transcript JSONL 的轮数，返回 {decision:"block"} 把统计
    #      横幅直接渲染给用户，不消耗模型调用。
    #   2) /caveman <mode>          —— 写 $FOREBRAIN_HOME/state/.caveman-active 标记
    #      文件（lite|full|ultra|wenyan*），切换 caveman 模式。
    #      自然语言短语 "activate caveman" / "stop caveman" / "normal mode" 也识别。
    #   3) 当标记文件存在时         —— 每个用户回合通过 hookSpecificOutput.additionalContext
    #      重注 caveman 风格规则，避免模型多轮后丢失约束。
    # 实现脚本由 systemskills 在启动时解包到 $FOREBRAIN_HOME/skills/.system/caveman/caveman-stats/scripts/。
    # 依赖 python3（macOS/Linux 自带）和 sqlite3 标准库；不需要额外安装。
    - matcher: "*"
      hooks:
        - type: "command"
          command: "python3 $FOREBRAIN_HOME/skills/.system/caveman/caveman-stats/scripts/caveman-mode-tracker.py"
          shell: "bash"
          # 钩子需快速返回避免阻塞用户输入；5 秒足够本地 sqlite + 文件读写。
          timeout: 5
          status_message: "caveman mode tracker"
          once: false
          async: false
          async_rewake: false
          # 允许脚本读取 FOREBRAIN_HOME 解析 sqlite 与状态文件路径；HOME/PATH 用于子进程定位 python3。
          allowed_env_vars:
            - "FOREBRAIN_HOME"
            - "HOME"
            - "PATH"
  # Default: no matchers.
  # Example: hook chain on session start.
  SessionStart:
    - matcher: "session(*)"
      # Default: none.
      # Example: hooks executed for the matcher.
      hooks:
        - type: "prompt"
          prompt: "Welcome the user and summarize the workspace state."
          if: "session(*)"
          timeout: 5
          status_message: "session start sample"
          once: true
          async: false
          async_rewake: false
          model: "gpt-4.1-mini"
          # Default: none.
          # Example: outbound headers for HTTP-capable hook runners.
          headers:
            X-Sample: "sessionstart"
          # Default: none.
          # Example: env allowlist forwarded to the hook process.
          allowed_env_vars:
            - "HOME"
  # Default: no matchers.
  # Example: hook chain when a run stops.
  Stop:
    - matcher: "stop(*)"
      # Default: none.
      # Example: hooks executed for the matcher.
      hooks:
        - type: "agent"
          prompt: "Summarize the final state and next action."
          if: "stop(*)"
          timeout: 5
          status_message: "stop sample"
          once: true
          async: false
          async_rewake: false
          model: "gpt-4.1-mini"
          # Default: none.
          # Example: outbound headers for HTTP-capable hook runners.
          headers:
            X-Sample: "stop"
          # Default: none.
          # Example: env allowlist forwarded to the hook process.
          allowed_env_vars:
            - "HOME"
  # Default: no matchers.
  # Example: hook chain when a subagent stops.
  SubagentStop:
    - matcher: "subagent(*)"
      # Default: none.
      # Example: hooks executed for the matcher.
      hooks:
        - type: "prompt"
          prompt: "Summarize the subagent outcome."
          if: "subagent(*)"
          timeout: 5
          status_message: "subagent stop sample"
          once: false
          async: false
          async_rewake: false
          model: "gpt-4.1-mini"
          # Default: none.
          # Example: outbound headers for HTTP-capable hook runners.
          headers:
            X-Sample: "subagentstop"
          # Default: none.
          # Example: env allowlist forwarded to the hook process.
          allowed_env_vars:
            - "HOME"

# Memory data is stored under <forebrain_home>/memories.
memories:
  # Default: true. Surface saved memories to following threads.
  use_memories: true
  # Default: true. Extract and consolidate memories from eligible threads.
  generate_memories: true
  # Default: false. Register memories_add_ad_hoc_note, memories_list,
  # memories_read, and memories_search.
  dedicated_tools: false
  # Default: false. Exclude a thread from generation after external context use.
  disable_on_external_context: false
  # Defaults and accepted ranges are enforced when the config is loaded.
  max_raw_memories_for_consolidation: 256
  max_unused_days: 30
  max_rollout_age_days: 10
  max_rollouts_per_startup: 2
  min_rollout_idle_hours: 6
  min_rate_limit_remaining_percent: 25
  # Empty uses the active provider's default model.
  extract_model: ""
  consolidation_model: ""
